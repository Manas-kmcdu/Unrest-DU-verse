<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unrest - Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e0d0b;
    --ink2: #3d3b35;
    --ink3: #7a776e;
    --paper: #f5f2eb;
    --cream: #ede9df;
    --white: #ffffff;
    --accent: #c84b2f;
    --accent2: #e8a020;
    --green: #2a6b4a;
    --blue: #1e4f8c;
    --border: rgba(14,13,11,0.10);
    --border-strong: rgba(14,13,11,0.18);
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --nav-h: 56px;
    --sidebar-w: 260px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* NAV */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--nav-h);
    background: rgba(245,242,235,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center;
    padding: 0 1.5rem;
    gap: 1.5rem;
  }
  .nav-logo {
    font-family: var(--serif);
    font-size: 1.35rem;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .nav-logo em { font-style: italic; color: var(--accent); }

  .nav-tabs {
    display: flex;
    gap: 2px;
    background: var(--cream);
    border: 0.5px solid var(--border);
    border-radius: 100px;
    padding: 3px;
    margin-left: auto;
  }
  .nav-tab {
    padding: 6px 18px;
    border-radius: 100px;
    border: none;
    background: transparent;
    font-family: var(--sans);
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink3);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-tab.active {
    background: var(--white);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(14,13,11,0.08);
  }
  .nav-tab:hover:not(.active) { color: var(--ink2); }

  .nav-right {
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .nav-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 700; color: #fff;
    cursor: pointer;
    border: 2px solid var(--white);
  }
  .nav-college-badge {
    font-size: 0.68rem; font-weight: 600;
    padding: 4px 10px;
    background: var(--cream);
    border: 0.5px solid var(--border-strong);
    border-radius: 100px;
    color: var(--ink2);
  }

  /* LAYOUT */
  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr 220px;
    gap: 0;
    max-width: 1200px;
    margin: 0 auto;
    padding-top: calc(var(--nav-h) + 2rem);
    padding-bottom: 4rem;
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  @media (max-width: 1024px) {
    .layout { grid-template-columns: var(--sidebar-w) 1fr; }
    .right-sidebar { display: none; }
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; padding-left: 1rem; padding-right: 1rem; }
    .left-sidebar { display: none; }
    .nav-tabs { display: none; }
  }

  /* SIDEBARS */
  .left-sidebar {
    padding-right: 2rem;
    padding-top: 0.5rem;
  }
  .sidebar-section { margin-bottom: 2rem; }
  .sidebar-label {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 0.6rem;
  }
  .sidebar-college {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--white);
    border: 0.5px solid var(--border);
    margin-bottom: 0.5rem;
  }
  .sc-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .sc-name { font-size: 0.82rem; font-weight: 600; color: var(--ink); }
  .sc-count { font-size: 0.68rem; color: var(--ink3); margin-left: auto; }

  .sidebar-stat {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0;
    border-bottom: 0.5px solid var(--border);
    font-size: 0.8rem;
  }
  .sidebar-stat:last-child { border-bottom: none; }
  .sidebar-stat-val { font-weight: 600; color: var(--ink); }
  .sidebar-stat-label { color: var(--ink3); }

  .right-sidebar {
    padding-left: 2rem;
    padding-top: 0.5rem;
  }
  .trending-item {
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .trending-item:last-child { border-bottom: none; }
  .trending-rank {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--ink3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .trending-text {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    margin-top: 2px;
    line-height: 1.3;
  }
  .trending-meta { font-size: 0.68rem; color: var(--ink3); margin-top: 2px; }

  /* FEED */
  .feed-col {
    border-left: 0.5px solid var(--border);
    border-right: 0.5px solid var(--border);
    min-height: 100vh;
    padding: 0 1.5rem;
  }

  .compose-bar {
    display: flex; gap: 10px; align-items: flex-start;
    padding-bottom: 1.25rem;
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 0;
  }
  .compose-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.62rem; font-weight: 700; color: #fff;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .compose-field {
    flex: 1;
    border: none;
    background: none;
    font-family: var(--sans);
    font-size: 0.95rem;
    color: var(--ink);
    resize: none;
    outline: none;
    line-height: 1.5;
    padding: 6px 0;
  }
  .compose-field::placeholder { color: var(--ink3); }
  .compose-actions {
    display: flex; justify-content: flex-end; gap: 8px;
    padding-top: 0.75rem;
    border-top: 0.5px solid var(--border);
  }
  .compose-submit {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 100px;
    padding: 8px 20px;
    font-family: var(--sans);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .compose-submit:hover { background: var(--accent); }
  .compose-submit:active { transform: scale(0.97); }

  /* POSTS */
  .post {
    padding: 1.25rem 0;
    border-bottom: 0.5px solid var(--border);
    position: relative;
  }
  .post:hover { background: transparent; }

  .post-header {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 0.6rem;
  }
  .post-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.62rem; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  .post-meta { flex: 1; }
  .post-name {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.2;
  }
  .post-college-line {
    font-size: 0.72rem;
    color: var(--ink3);
    margin-top: 1px;
  }
  .post-college-line strong {
    color: var(--ink2);
    font-weight: 500;
  }
  .post-time {
    font-size: 0.7rem;
    color: var(--ink3);
    flex-shrink: 0;
    margin-top: 2px;
  }

  .post-text {
    font-size: 0.92rem;
    color: var(--ink2);
    line-height: 1.65;
    margin-bottom: 0.9rem;
    padding-left: 46px;
  }
  .post-text a { color: var(--accent); text-decoration: none; }

  /* RATIO BANNER */
  .ratio-banner {
    margin-left: 46px;
    margin-bottom: 0.75rem;
    padding: 8px 14px;
    background: rgba(200,75,47,0.06);
    border: 0.5px solid rgba(200,75,47,0.2);
    border-left: 2.5px solid var(--accent);
    border-radius: 0 8px 8px 0;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.01em;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .ratio-banner.visible { display: flex; }
  .ratio-label { font-weight: 700; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; }

  /* ACTIONS */
  .post-actions {
    display: flex; align-items: center; gap: 0;
    padding-left: 46px;
  }
  .action-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px;
    border: none;
    background: none;
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink3);
    cursor: pointer;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
    user-select: none;
  }
  .action-btn:hover { background: var(--cream); color: var(--ink2); }

  .vote-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 12px;
    border: 0.5px solid var(--border-strong);
    background: var(--white);
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .vote-btn:hover { border-color: var(--ink); color: var(--ink); }
  .vote-btn.w-btn { border-radius: 8px 0 0 8px; border-right: none; }
  .vote-btn.l-btn { border-radius: 0 8px 8px 0; }
  .vote-btn.w-active { background: var(--green); border-color: var(--green); color: #fff; }
  .vote-btn.l-active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .vote-divider {
    width: 0.5px;
    height: 20px;
    background: var(--border-strong);
    flex-shrink: 0;
  }

  .vote-ratio {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--ink3);
    padding: 0 6px;
    letter-spacing: 0.02em;
  }

  .comment-count {
    font-size: 0.68rem;
    color: var(--ink3);
    padding: 0 6px;
  }

  /* COLLEGE TAG */
  .college-tag {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 100px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
    margin-left: 46px;
  }

  /* EVENT CARD */
  .event-card {
    margin-left: 46px;
    margin-bottom: 0.75rem;
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--white);
  }
  .event-header {
    padding: 14px 16px 10px;
    border-bottom: 0.5px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .event-type {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink3);
    margin-bottom: 4px;
  }
  .event-name {
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--ink);
    line-height: 1.2;
  }
  .event-date {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--accent);
    padding: 4px 10px;
    background: rgba(200,75,47,0.08);
    border: 0.5px solid rgba(200,75,47,0.15);
    border-radius: 100px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .event-details {
    padding: 10px 16px;
    font-size: 0.78rem;
    color: var(--ink3);
    display: flex; gap: 16px;
  }
  .event-detail { display: flex; align-items: center; gap: 5px; }
  .event-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink3); }
  .event-register {
    display: block;
    padding: 8px 16px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
  }
  .event-register:hover { background: var(--accent); }

  /* SECTION HEADER */
  .section-header {
    display: flex; align-items: center;
    padding: 1rem 0 0.75rem;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 0;
    gap: 8px;
  }
  .section-header-line { flex: 1; height: 0.5px; background: var(--border); }

  /* MOBILE TAB BAR */
  .mobile-tabs {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 200;
    background: rgba(245,242,235,0.96);
    backdrop-filter: blur(16px);
    border-top: 0.5px solid var(--border);
    padding: 6px 1rem 8px;
    justify-content: space-around;
  }
  .mobile-tab {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px;
    padding: 6px 16px;
    border-radius: 10px;
    border: none;
    background: none;
    font-family: var(--sans);
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--ink3);
    cursor: pointer;
    transition: color 0.15s;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .mobile-tab.active { color: var(--accent); }
  .mobile-tab-icon {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  @media (max-width: 720px) {
    .mobile-tabs { display: flex; }
    body { padding-bottom: 64px; }
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .post { animation: fadeUp 0.35s ease both; }

  /* COMPOSE expanded */
  .compose-wrap {
    padding: 1rem 0 0;
    margin-bottom: 0;
  }
  .compose-expanded {
    display: none;
  }
  .compose-field:focus ~ .compose-expanded,
  .compose-wrap:focus-within .compose-expanded {
    display: flex;
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="#" class="nav-logo">Un<em>rest</em></a>

  <div class="nav-tabs" id="main-tabs">
    <button class="nav-tab active" onclick="switchTab('du')">DU</button>
    <button class="nav-tab" onclick="switchTab('college')">College</button>
    <button class="nav-tab" onclick="switchTab('competitions')">Competitions & Events</button>
  </div>

  <div class="nav-right">
    <span class="nav-college-badge" id="user-college-badge">SRCC</span>
    <div class="nav-avatar" id="user-avatar">RK</div>
  </div>
</nav>

<div class="layout">

  <!-- LEFT SIDEBAR -->
  <div class="left-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Your college</div>
      <div class="sidebar-college">
        <div class="sc-dot" style="background:#c84b2f"></div>
        <div>
          <div class="sc-name" id="sidebar-college-name">SRCC</div>
        </div>

    </div>

    <div class="sidebar-section">

      <div class="sidebar-stat"><span class="sidebar-stat-label">Active now</span><span class="sidebar-stat-val">23</span></div>
      <div class="sidebar-stat"><span class="sidebar-stat-label">DU-wide</span><span class="sidebar-stat-val">1,247</span></div>
      <div class="sidebar-stat"><span class="sidebar-stat-label">Your echoes</span><span class="sidebar-stat-val">3</span></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Quick links</div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <button onclick="switchTab('du')" style="text-align:left;background:none;border:none;font-family:var(--sans);font-size:0.82rem;color:var(--ink2);padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:500;transition:background 0.15s;" onmouseover="this.style.background='var(--cream)'" onmouseout="this.style.background='none'">DU feed</button>
        <button onclick="switchTab('college')" style="text-align:left;background:none;border:none;font-family:var(--sans);font-size:0.82rem;color:var(--ink2);padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:500;transition:background 0.15s;" onmouseover="this.style.background='var(--cream)'" onmouseout="this.style.background='none'">My college</button>
        <button onclick="switchTab('competitions')" style="text-align:left;background:none;border:none;font-family:var(--sans);font-size:0.82rem;color:var(--ink2);padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:500;transition:background 0.15s;" onmouseover="this.style.background='var(--cream)'" onmouseout="this.style.background='none'">Competitions & Events</button>
      </div>
    </div>
  </div>

  <!-- MAIN FEED -->
  <div class="feed-col">

    <!-- COMPOSE -->
    <div class="compose-wrap" id="compose-area">
      <div class="compose-bar">
        <div class="compose-avatar" id="compose-avatar">RK</div>
        <textarea
          class="compose-field"
          id="compose-input"
          rows="2"
          placeholder="What's happening at DU?"
          onfocus="expandCompose()"
          oninput="autoResize(this)"
        ></textarea>
      </div>
      <div class="compose-actions" id="compose-footer" style="display:none">
        <span style="font-size:0.72rem;color:var(--ink3);align-self:center;" id="compose-charcount">0 / 240</span>
        <button class="compose-submit" onclick="submitPost()">Post</button>
      </div>
    </div>

    <!-- FEED SECTIONS -->
    <div id="feed-du" class="feed-section">
      <div class="section-header"><span>DU</span><div class="section-header-line"></div></div>
    </div>

    <div id="feed-college" class="feed-section" style="display:none">
      <div class="section-header"><span id="college-section-label">SRCC</span><div class="section-header-line"></div></div>
    </div>

    <div id="feed-competitions" class="feed-section" style="display:none">
      <div class="section-header"><span>Competitions & Events</span><div class="section-header-line"></div></div>
    </div>

  </div>

  <!-- RIGHT SIDEBAR -->
  <div class="right-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Trending</div>
      <div id="trending-list"></div>
    </div>

    <div class="sidebar-section" style="margin-top:1.5rem">
      <div class="sidebar-label">Top colleges today</div>
      <div id="top-colleges-list"></div>
    </div>
  </div>

</div>

<!-- MOBILE TABS -->
<div class="mobile-tabs" id="mobile-tabs">
  <button class="mobile-tab active" onclick="switchTab('du')">
    <div class="mobile-tab-icon"></div>
    DU
  </button>
  <button class="mobile-tab" onclick="switchTab('college')">
    <div class="mobile-tab-icon"></div>
    College
  </button>
  <button class="mobile-tab" onclick="switchTab('competitions')">
    <div class="mobile-tab-icon"></div>
    Events
  </button>
</div>

<script>
const COLLEGES = [
  { id:'srcc', name:'SRCC', color:'#c84b2f' },
  { id:'hindu', name:'Hindu College', color:'#1e4f8c' },

  { id:'kirorimal', name:'Kirori Mal', color:'#e65100' },
  { id:'ramjas', name:'Ramjas', color:'#2e7d32' },
  { id:'gargi', name:'Gargi', color:'#c2185b' },
  { id:'venky', name:'Sri Venky', color:'#6d4c41' },
];

// Seed data - realistic DU posts
const DU_POSTS = [
  {
    id: 'du1',
    author: 'Rohan Mehta',
    initials: 'RM',
    college: 'Hindu College',
    collegeColor: '#1e4f8c',
    year: '3rd yr · Economics',
    text: "North Campus is genuinely unbeatable in winters. The chai stalls, the cold fog, the DTC chaos - people who say South Campus is better have never experienced this.",
    time: '2h ago',
    postedAt: Date.now() - 2.5 * 60 * 60 * 1000,
    w: 312, l: 48, comments: 142,
    voted: null
  },
  {
    id: 'du2',
    author: 'Priya Sharma',
    initials: 'PS',
    college: 'LSR',
    collegeColor: '#7b1fa2',
    year: '2nd yr · English',
    text: "Placement season is doing something weird to people. Everyone's suddenly in three case comp clubs and four consulting bootcamps. Calm down, it is October.",
    time: '4h ago',

// RATIO LOGIC
function isRatioed(post) {
  if (post.comments <= post.w) return false;
  const ageMs = Date.now() - post.postedAt;
  const twoHours = 2 * 60 * 60 * 1000;
  if (ageMs >= twoHours) return true;
  if (post.w >= 5) return true;
  return false;
}

function ratioText(post) {
  const ratio = (post.comments / Math.max(post.w, 1)).toFixed(1);
  return `Ratio alert - ${post.comments} comments vs ${post.w} Ws (${ratio}x)`;
}

function renderPost(p) {
  const ratioed = isRatioed(p);
  const totalVotes = p.w + p.l;
  const wPct = totalVotes > 0 ? Math.round((p.w / totalVotes) * 100) : 0;

  const collegeTagHtml = p.isOfficial
    ? `<div class="college-tag" style="background:${p.collegeColor}18;color:${p.collegeColor};border:0.5px solid ${p.collegeColor}30">${p.college} · Official</div>`
    : `<div class="college-tag" style="background:${p.collegeColor}12;color:${p.collegeColor};border:0.5px solid ${p.collegeColor}25">${p.college}</div>`;

  const eventCardHtml = p.isEvent ? `
    <div class="event-card">
      <div class="event-header">
        <div>
          <div class="event-type">${p.eventType}</div>
          <div class="event-name">${p.eventName}</div>
        </div>
        <div class="event-date">${p.eventDate}</div>
      </div>
      <div class="event-details">
        ${p.eventDetails.map(d => `<div class="event-detail"><div class="event-dot"></div>${d}</div>`).join('')}
      </div>
      <button class="event-register">Register now</button>
    </div>
  ` : '';

  const ratioBannerHtml = `
    <div class="ratio-banner ${ratioed ? 'visible' : ''}" id="ratio-${p.id}">
      <div class="ratio-label">Ratio</div>
      <span>${ratioText(p)}</span>
    </div>
  `;

  const wActive = p.voted === 'w' ? 'w-active' : '';
  const lActive = p.voted === 'l' ? 'l-active' : '';

  return `
    <div class="post" id="post-${p.id}" style="animation-delay:${Math.random()*0.2}s">
      <div class="post-header">
        <div class="post-avatar" style="background:${p.collegeColor}">${p.initials}</div>
        <div class="post-meta">
          <div class="post-name">${p.author}</div>
          <div class="post-college-line"><strong>${p.college}</strong> · ${p.year}</div>
        </div>
        <div class="post-time">${p.time}</div>
      </div>
      ${collegeTagHtml}
      ${eventCardHtml}
      <div class="post-text">${p.text}</div>
      ${ratioBannerHtml}
      <div class="post-actions">
        <button class="vote-btn w-btn ${wActive}" id="w-${p.id}" onclick="vote('${p.id}','w')">
          W <span id="wcount-${p.id}">${p.w}</span>
        </button>
        <div class="vote-divider"></div>
        <button class="vote-btn l-btn ${lActive}" id="l-${p.id}" onclick="vote('${p.id}','l')">
          <span id="lcount-${p.id}">${p.l}</span> L
        </button>
        <span class="vote-ratio" id="ratio-pct-${p.id}">${wPct}% W</span>
        <button class="action-btn" onclick="openComments('${p.id}')">
          <span id="ccount-${p.id}">${p.comments}</span> comments
        </button>
        <button class="action-btn" style="margin-left:auto" onclick="sharePost('${p.id}')">share</button>
      </div>
    </div>
  `;
}

// Post store for vote state

function renderFeed(containerId, posts) {
  const container = document.getElementById(containerId);
  const header = container.querySelector('.section-header');
  const postsHtml = posts.map(renderPost).join('');
  // Clear old posts, keep header
  container.innerHTML = '';
  container.appendChild(header);
  header.insertAdjacentHTML('afterend', postsHtml);
}

// VOTE
function vote(postId, type) {
  const p = postStore[postId];
  if (!p) return;

  if (p.voted === type) {
    // Undo
    p[type]--;
    p.voted = null;
  } else {
    if (p.voted) p[p.voted]--;
    p[type]++;
    p.voted = type;
  }

  // Update UI
  document.getElementById('wcount-' + postId).textContent = p.w;
  document.getElementById('lcount-' + postId).textContent = p.l;

  const wBtn = document.getElementById('w-' + postId);
  const lBtn = document.getElementById('l-' + postId);
  wBtn.className = 'vote-btn w-btn' + (p.voted === 'w' ? ' w-active' : '');
  lBtn.className = 'vote-btn l-btn' + (p.voted === 'l' ? ' l-active' : '');

  const total = p.w + p.l;
  const wPct = total > 0 ? Math.round((p.w / total) * 100) : 0;
  document.getElementById('ratio-pct-' + postId).textContent = wPct + '% W';

  // Check ratio
  const banner = document.getElementById('ratio-' + postId);
  if (banner) {
    if (isRatioed(p)) {
      banner.innerHTML = `<div class="ratio-label">Ratio</div><span>${ratioText(p)}</span>`;
      banner.classList.add('visible');
    } else {
      banner.classList.remove('visible');
    }
  }

  // Micro bounce
  const btn = document.getElementById((type === 'w' ? 'w-' : 'l-') + postId);
  btn.style.transform = 'scale(1.12)';
  setTimeout(() => btn.style.transform = '', 150);
}

function openComments(postId) {
  // Placeholder - future: inline comments expand
  const p = postStore[postId];
  if (p) {
    p.comments++;
    document.getElementById('ccount-' + postId).textContent = p.comments;
    // Re-check ratio
    const banner = document.getElementById('ratio-' + postId);
    if (banner && isRatioed(p)) {
      banner.innerHTML = `<div class="ratio-label">Ratio</div><span>${ratioText(p)}</span>`;
      banner.classList.add('visible');
    }
  }
}

function sharePost(postId) {
  navigator.clipboard.writeText(window.location.href + '#post-' + postId)
    .catch(() => {});
}

// TAB SWITCHING
let activeTab = 'du';
function switchTab(tab) {
  activeTab = tab;
  ['du','college','competitions'].forEach(t => {
    document.getElementById('feed-' + t).style.display = t === tab ? 'block' : 'none';
  });

  // Desktop tabs
  document.querySelectorAll('#main-tabs .nav-tab').forEach((btn, i) => {
    const tabs = ['du','college','competitions'];
    btn.classList.toggle('active', tabs[i] === tab);
  });

  // Mobile tabs
  document.querySelectorAll('#mobile-tabs .mobile-tab').forEach((btn, i) => {
    const tabs = ['du','college','competitions'];
    btn.classList.toggle('active', tabs[i] === tab);
  });

  // Compose placeholder
  const placeholders = {
    du: "What's happening at DU?",
    college: `Post to ${userCollege}...`,
    competitions: "Share a competition or event..."
  };
  document.getElementById('compose-input').placeholder = placeholders[tab] || "What's on your mind?";
}

// COMPOSE
function expandCompose() {
  document.getElementById('compose-footer').style.display = 'flex';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
  document.getElementById('compose-charcount').textContent = el.value.length + ' / 240';
}

document.getElementById('compose-input').addEventListener('input', function() {
  if (this.value.length > 240) this.value = this.value.slice(0, 240);
});

document.addEventListener('click', function(e) {
  const compose = document.getElementById('compose-area');
  if (!compose.contains(e.target)) {
    if (!document.getElementById('compose-input').value) {
      document.getElementById('compose-footer').style.display = 'none';
    }
  }
});

function submitPost() {
  const input = document.getElementById('compose-input');
  const text = input.value.trim();
  if (!text) return;

  const now = Date.now();
  const newPost = {
    id: 'user-' + now,
    author: userName,
    initials: userInitials,
    college: userCollege,
    collegeColor: userCollegeColor,
    year: '· You',
    text: text,
    time: 'Just now',
    postedAt: now,
    w: 0, l: 0, comments: 0,
    voted: null
  };

  postStore[newPost.id] = newPost;

  const feedId = activeTab === 'du' ? 'feed-du' : activeTab === 'college' ? 'feed-college' : 'feed-competitions';
  const feed = document.getElementById(feedId);
  const header = feed.querySelector('.section-header');
  header.insertAdjacentHTML('afterend', renderPost(newPost));

  input.value = '';
  input.style.height = '';
  document.getElementById('compose-footer').style.display = 'none';
  document.getElementById('compose-charcount').textContent = '0 / 240';

  // Scroll to new post
  const newEl = document.getElementById('post-' + newPost.id);
  if (newEl) newEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
