function Avatar({initials,college,size=36}){
  const bg=COL_COLOR[college]||"#455a64";
  return(
    <div style={{width:size,height:size,borderRadius:"50%",background:bg,flexShrink:0,
      display:"flex",alignItems:"center",justifyContent:"center",
      fontSize:size*0.3,fontWeight:600,color:"#fff",letterSpacing:"0.03em"}}>
      {initials}

  );
}

function Pill({name,color}){
  const bg=color||COL_COLOR[name]||"#455a64";
  return(
    <span style={{fontSize:"0.58rem",fontWeight:600,letterSpacing:"0.07em",textTransform:"uppercase",
      background:`${bg}18`,color:bg,border:`1px solid ${bg}28`,borderRadius:3,padding:"2px 6px"}}>
      {colAbbr(name)}
    </span>
  );
}

function MentionInput({value,onChange,placeholder,multiline=false}){
  const [sug,setSug]=useState([]);const [show,setShow]=useState(false);
  const [ms,setMs]=useState(-1);const ref=useRef();
  function onInput(e){
    const v=e.target.value;onChange(v);
    const cur=e.target.selectionStart;
    const m=v.slice(0,cur).match(/@(\w*)$/);
    if(m){
      setMs(cur-m[0].length);
      const q=m[1].toLowerCase();
      const f=ALL_USERS.filter(u=>u.name.toLowerCase().includes(q)||u.handle.slice(1).includes(q)).slice(0,5);
      setSug(f);setShow(f.length>0);
    }else setShow(false);
  }
  function pick(u){
    const bef=value.slice(0,ms);const aft=value.slice(ref.current.selectionStart);
    onChange(bef+u.handle+" "+aft);setShow(false);ref.current.focus();
  }
  const shared={width:"100%",padding:"8px 11px",border:"1px solid var(--border)",
    borderRadius:6,fontSize:"0.85rem",color:"var(--ink)",background:"var(--white)",
    outline:"none",lineHeight:1.5,resize:multiline?"vertical":"none",fontFamily:"var(--sans)"};
  return(
    <div style={{position:"relative",flex:1}}>
      {multiline
        ?<textarea ref={ref} value={value} onChange={onInput} placeholder={placeholder} rows={3} style={shared}/>
        :<input ref={ref} value={value} onChange={onInput} placeholder={placeholder} style={shared}/>}
      {show&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--white)",
          border:"1px solid var(--border)",borderRadius:6,zIndex:300,marginTop:2,
          boxShadow:"0 6px 20px rgba(14,13,11,0.12)",overflow:"hidden"}}>
          {sug.map(u=>(
            <div key={u.handle} onClick={()=>pick(u)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",cursor:"pointer"}}
              onMouseEnter={e=>e.currentTarget.style.background="var(--paper)"}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <Avatar initials={u.name.slice(0,2).toUpperCase()} college={u.college} size={22}/>
              <div>
                <div style={{fontSize:"0.75rem",fontWeight:600,color:"var(--ink)"}}>{u.name}</div>
                <div style={{fontSize:"0.62rem",color:"var(--ink3)"}}>{u.handle} · {u.college}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function WLBar({w,l,postId,onVote,voted}){
  const total=w+l;const pct=total>0?Math.round((w+(voted==="w"?1:0))/(total+1)*100):50;

  const totalFinal=wFinal+lFinal;
  return(
    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <button onClick={()=>onVote(postId,"w")}
        style={{display:"flex",alignItems:"center",gap:7,padding:"5px 13px",

  );
}

function Poll({poll,postId}){
  const [voted,setVoted]=useState(null);
  const [opts,setOpts]=useState(poll.options);
  const total=opts.reduce((s,o)=>s+o.votes,0)+(voted?1:0);

  function vote(id){
    if(voted)return;
    setOpts(p=>p.map(o=>o.id===id?{...o,votes:o.votes+1}:o));
    setVoted(id);
  }

  return(
    <div style={{marginBottom:12,padding:"12px 14px",
      border:"1px solid var(--border)",borderRadius:7,background:"var(--white)"}}>
      <div style={{fontSize:"0.8rem",fontWeight:600,color:"var(--ink)",
        marginBottom:10,lineHeight:1.4}}>
        {poll.question}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {opts.map(o=>{
          const pct=total>0?Math.round((o.votes+(voted===o.id?1:0))/total*100):0;
          const isVoted=voted===o.id;
          return(
            <div key={o.id} onClick={()=>vote(o.id)}
              style={{position:"relative",borderRadius:5,overflow:"hidden",
                border:`1px solid ${isVoted?"var(--ink)":"var(--border)"}`,
                cursor:voted?"default":"pointer",
                transition:"border-color 0.15s"}}>
              {/* fill bar */}
              {voted&&(
                <div style={{position:"absolute",inset:0,left:0,top:0,bottom:0,
                  width:`${pct}%`,background:isVoted?"rgba(14,13,11,0.08)":"rgba(14,13,11,0.04)",
                  transition:"width 0.4s ease",borderRadius:4}}/>
              )}
              <div style={{position:"relative",display:"flex",
                alignItems:"center",justifyContent:"space-between",
                padding:"8px 11px"}}>
                <span style={{fontSize:"0.82rem",
                  color:isVoted?"var(--ink)":"var(--ink2)",
                  fontWeight:isVoted?600:400}}>
                  {o.text}
                </span>
                {voted&&(
                  <span style={{fontSize:"0.72rem",fontWeight:600,
                    color:isVoted?"var(--ink)":"var(--ink3)",flexShrink:0,marginLeft:8}}>
                    {pct}%
                  </span>
                )}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{fontSize:"0.62rem",color:"var(--ink4)",marginTop:8}}>
        {total} vote{total!==1?"s":""}{voted?" · Results shown":""}
      </div>
    </div>
  );
}

                <span style={{fontSize:"0.72rem",color:"var(--ink3)"}}>
                  {post.author.year} · {post.author.dept}
                </span>
                <span style={{fontSize:"0.68rem",color:"var(--ink4)"}}>· {post.time}</span>

                background:"transparent",border:"1px solid var(--border)",borderRadius:5,
                fontSize:"0.7rem",fontWeight:500,
                color:followed?"var(--ink4)":"var(--ink2)",transition:"all 0.15s"}}>

        {post.tags.length>0&&(
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
            {post.tags.map(t=>(
              <span key={t} style={{fontSize:"0.68rem",color:"var(--ink3)",fontWeight:500}}>
                #{t}
              </span>
            ))}
          </div>
        )}

        {post.poll&&<Poll poll={post.poll} postId={post.id}/>}

        {post.originalQuote&&(
          <div style={{marginBottom:12,padding:"10px 12px",
            border:"1px solid var(--border)",borderRadius:6,background:"var(--paper)"}}>
            <div style={{fontSize:"0.62rem",fontWeight:600,color:"var(--ink3)",
              marginBottom:4,textTransform:"uppercase",letterSpacing:"0.07em"}}>
              Quoting {post.originalQuote.author}
            </div>
            <p style={{fontSize:"0.8rem",color:"var(--ink2)",lineHeight:1.5}}>
              {post.originalQuote.text}{post.originalQuote.text.length>=80?"...":""}
            </p>
          </div>
        )}

        {/* actions */}
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:0}}>
          <WLBar w={post.w} l={post.l} postId={post.id} onVote={onVote} voted={voted}/>
          <span style={{fontSize:"0.7rem",color:"var(--ink4)"}}>·</span>
          <button onClick={()=>setCommOpen(!commOpen)}
            style={{background:"none",border:"none",fontSize:"0.72rem",
              color:"var(--ink3)",fontWeight:500,padding:0}}>
            {localComm.length} comment{localComm.length!==1?"s":""}
          </button>
          <button onClick={()=>onQuote(post)}
            style={{background:"none",border:"none",fontSize:"0.72rem",
              color:"var(--ink3)",fontWeight:500,padding:0}}>
            Quote repost
          </button>
          <button onClick={()=>{onSave(post.id);
              notify(saved?"Removed from saved":"Saved to collection");}}
            style={{background:"none",border:"none",fontSize:"0.72rem",
              color:saved?"var(--blue)":"var(--ink3)",
              fontWeight:saved?600:500,padding:0}}>
            {saved?"Saved":"Save"}
          </button>
          <span style={{marginLeft:"auto",fontSize:"0.7rem",color:"var(--ink4)",
            cursor:"pointer",fontWeight:400}}>share</span>
        </div>

        {/* comments area */}
        {commOpen&&(
          <div style={{marginTop:14}}>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <MentionInput value={commText} onChange={setCommText}
                placeholder="Add a comment... (@mention someone)"/>
              <button onClick={submitComment}
                style={{padding:"8px 13px",background:"var(--ink)",color:"#fff",border:"none",
                  borderRadius:5,fontSize:"0.76rem",fontWeight:600,flexShrink:0}}>
                Post
              </button>
            </div>
            {localComm.map(c=><CommentRow key={c.id} c={c}/>)}
          </div>
        )}
      </div>
    </article>
  );
}

function BannerSlideshow(){
  const [idx,setIdx]=useState(0);
  const [fade,setFade]=useState(true);

  useEffect(()=>{
    const t=setInterval(()=>{
      setFade(false);
      setTimeout(()=>{setIdx(i=>(i+1)%BANNERS.length);setFade(true);},300);
    },3000);
    return()=>clearInterval(t);
  },[]);

  const b=BANNERS[idx];

  return(
    <div style={{marginBottom:20,borderRadius:10,overflow:"hidden",
      background:b.bg,position:"relative",height:130,
      opacity:fade?1:0,transition:"opacity 0.3s ease",cursor:"pointer"}}>

      {/* layer 1 — large filled circle far right */}
      <div style={{position:"absolute",right:-45,top:"50%",transform:"translateY(-50%)",
        width:160,height:160,borderRadius:"50%",
        background:`${b.accent}1a`,pointerEvents:"none"}}/>
      {/* layer 2 — medium circle overlapping */}
      <div style={{position:"absolute",right:30,top:-50,
        width:110,height:110,borderRadius:"50%",
        background:`${b.accent}12`,pointerEvents:"none"}}/>
      {/* layer 3 — small tight circle bottom right */}
      <div style={{position:"absolute",right:60,bottom:-20,
        width:70,height:70,borderRadius:"50%",
        background:`${b.accent}18`,pointerEvents:"none"}}/>
      {/* layer 4 — left accent bar */}
      <div style={{position:"absolute",top:0,bottom:0,left:0,
        width:4,background:b.accent,opacity:0.35,pointerEvents:"none"}}/>
      {/* layer 5 — top edge line */}
      <div style={{position:"absolute",top:0,left:0,right:0,
        height:2,background:b.accent,opacity:0.18,pointerEvents:"none"}}/>
      {/* layer 6 — diagonal stripe bottom-right decorative */}
      <div style={{position:"absolute",right:0,bottom:0,width:90,height:90,
        pointerEvents:"none",overflow:"hidden",borderRadius:"0 0 10px 0"}}>
        {[0,1,2,3,4].map(i=>(
          <div key={i} style={{position:"absolute",
            left:`${i*18-10}px`,top:0,bottom:0,width:1,
            background:b.accent,opacity:0.08,
            transform:"rotate(35deg)",transformOrigin:"top center"}}/>
        ))}
      </div>

      <div style={{position:"relative",zIndex:1,
        height:"100%",display:"flex",flexDirection:"column",
        justifyContent:"space-between",padding:"14px 16px 12px"}}>

        <div style={{fontFamily:"var(--serif)",
          fontSize:"1.8rem",fontStyle:"italic",
          color:b.ink,lineHeight:1.07,letterSpacing:"-0.025em",
          whiteSpace:"pre-line",flex:1,display:"flex",alignItems:"flex-start"}}>
          {b.headline}
        </div>

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:8}}>
          <div style={{display:"flex",gap:4,alignItems:"center"}}>
            {BANNERS.map((_,i)=>(
              <div key={i}
                onClick={e=>{e.stopPropagation();setFade(false);
                  setTimeout(()=>{setIdx(i);setFade(true);},300);}}
                style={{width:i===idx?14:4,height:3,borderRadius:2,
                  background:i===idx?b.accent:`${b.accent}38`,
                  transition:"all 0.3s ease",cursor:"pointer"}}/>
            ))}
          </div>
          <span style={{fontSize:"0.58rem",fontWeight:700,letterSpacing:"0.08em",
            textTransform:"uppercase",color:b.accent,
            background:`${b.accent}20`,borderRadius:4,padding:"2px 7px"}}>
            {b.tag}
          </span>
        </div>
      </div>
    </div>
  );
}

function UnrestFeed() {
  const [posts,setPosts]=useState(INITIAL_POSTS);
  const [tab,setTab]=useState("du");
  const [voted,setVoted]=useState({});
  const [savedPosts,setSavedPosts]=useState(new Set());
  const [followedUsers,setFollowedUsers]=useState(new Set());
  const [quoteModal,setQuoteModal]=useState(null);
  const [toast,setToast]=useState(null);
  const [searchQ,setSearchQ]=useState("");
  const [searchCollege,setSearchCollege]=useState("");
  const [newPostText,setNewPostText]=useState("");
  const [pollMode,setPollMode]=useState(false);
  const [pollOpts,setPollOpts]=useState(["",""]);

  function notify(msg){setToast(msg);setTimeout(()=>setToast(null),2800);}
  function handleVote(id,type){
    setVoted(p=>p[id]===type?{...p,[id]:null}:{...p,[id]:type});
    if(type==="w")notify("W noted");
  }
  function handleSave(id){setSavedPosts(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});}
  function handleFollow(handle){setFollowedUsers(p=>{const n=new Set(p);n.has(handle)?n.delete(handle):n.add(handle);return n;});}
  function handleQuoteSubmit(original,text){
    setPosts(p=>[{id:Date.now(),pinned:false,
      author:{name:"MP",handle:"@mp",college:"Kirori Mal",year:"2nd yr",dept:"Economics",
        initials:"MP",verified:false,society:null,followers:0,mutuals:[]},
      text,tags:[],w:0,l:0,comments:[],saves:0,shares:0,time:"just now",
      feed:original.feed||"du",
      originalQuote:{author:original.author.handle,text:original.text.slice(0,80)},
    },...p]);
    setQuoteModal(null);notify("Quote reposted");
  }
  function submitPost(){
    if(!newPostText.trim())return;
    const f=(tab==="college")?"college":"du";
    const validOpts=pollOpts.filter(o=>o.trim());
    const poll=pollMode&&validOpts.length>=2
      ?{question:newPostText.trim(),options:validOpts.map((t,i)=>({id:String.fromCharCode(97+i),text:t,votes:0}))}
      :null;
    setPosts(p=>[{id:Date.now(),pinned:false,
      author:{name:"MP",handle:"@mp",college:"Kirori Mal",year:"2nd yr",dept:"Economics",
        initials:"MP",verified:false,society:null,followers:347,mutuals:[]},
      text:poll?`Poll: ${newPostText}`:newPostText,
      tags:[],w:0,l:0,comments:[],saves:0,shares:0,time:"just now",feed:f,poll
    },...p]);
    setNewPostText("");setPollMode(false);setPollOpts(["",""]);
    notify(`Posted to ${f==="college"?"College":"DU"} feed`);
  }

  const TABS=[
    {id:"du",label:"DU"},{id:"college",label:"College"},
    {id:"events",label:"Competitions & Events"},
    {id:"following",label:"Following"},{id:"saved",label:"Saved"}
  ];

  const visible=posts.filter(p=>{
    if(searchQ&&!p.text.toLowerCase().includes(searchQ.toLowerCase())&&
       !p.author.name.toLowerCase().includes(searchQ.toLowerCase())&&
       !p.tags.join(" ").toLowerCase().includes(searchQ.toLowerCase()))return false;
    if(searchCollege&&p.author.college!==searchCollege)return false;
    if(tab==="du")return p.feed==="du";
    if(tab==="college")return p.feed==="college";
    if(tab==="following")return followedUsers.has(p.author.handle);
    if(tab==="saved")return savedPosts.has(p.id);
    return true;
  });

  return(
    <div style={{fontFamily:"var(--sans)",background:"var(--paper)",minHeight:"100vh"}}>
      <style>{CSS}</style>

      {toast&&(
        <div style={{position:"fixed",top:14,left:"50%",transform:"translateX(-50%)",
          background:"var(--ink)",color:"#fff",padding:"7px 16px",borderRadius:5,
          fontSize:"0.76rem",fontWeight:500,zIndex:9999,whiteSpace:"nowrap",
          boxShadow:"0 4px 16px rgba(0,0,0,0.18)",animation:"toastIn 0.22s ease"}}>
          {toast}
        </div>
      )}

      {quoteModal&&(
        <QuoteModal post={quoteModal} onClose={()=>setQuoteModal(null)}
          onSubmit={t=>handleQuoteSubmit(quoteModal,t)}/>
      )}

      {/* NAV */}
      <nav style={{background:"rgba(242,239,232,0.96)",borderBottom:"1px solid var(--border)",
        padding:"0 2rem",position:"sticky",top:0,zIndex:100,backdropFilter:"blur(10px)"}}>
        <div style={{maxWidth:1100,margin:"0 auto",display:"flex",alignItems:"center",height:52,gap:0}}>
          <a style={{fontFamily:"var(--serif)",fontSize:"1.5rem",color:"var(--ink)",
            textDecoration:"none",letterSpacing:"-0.02em",marginRight:28,flexShrink:0,cursor:"pointer"}}>
            Un<em style={{fontStyle:"italic",color:"var(--accent)"}}>rest</em>
          </a>

          <div style={{display:"flex",alignItems:"center",background:"rgba(14,13,11,0.07)",
            borderRadius:100,padding:"3px",gap:1}}>
            {TABS.slice(0,3).map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{padding:"5px 15px",borderRadius:100,border:"none",
                  background:tab===t.id?"var(--white)":"transparent",
                  fontSize:"0.76rem",fontWeight:tab===t.id?600:400,
                  color:tab===t.id?"var(--ink)":"var(--ink3)",
                  transition:"all 0.15s",
                  boxShadow:tab===t.id?"0 1px 3px rgba(0,0,0,0.09)":"none"}}>
                {t.label}
              </button>
            ))}
          </div>

          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:7,padding:"4px 10px 4px 5px",
              border:"1px solid var(--border)",borderRadius:5,background:"var(--white)"}}>
              <div style={{width:24,height:24,borderRadius:"50%",background:"#c84b2f",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:"0.58rem",fontWeight:700,color:"#fff"}}>MP</div>
              <span style={{fontSize:"0.78rem",fontWeight:500,color:"var(--ink2)"}}>Kirori Mal</span>
            </div>
          </div>
        </div>
      </nav>

      {/* 3-COL LAYOUT */}
      <div style={{maxWidth:1100,margin:"0 auto",display:"grid",

              Your college
            </div>
            <div style={{background:"var(--white)",border:"1px solid var(--border)",
              borderRadius:7,padding:"9px 11px",display:"flex",alignItems:"center",gap:8}}>

                animation:"dot-pulse 2s infinite",flexShrink:0}}/>
              <span style={{fontSize:"0.85rem",fontWeight:600,color:"var(--ink)",flex:1}}>Kirori Mal</span>
              <span style={{fontSize:"0.72rem",color:"var(--ink3)"}}>347 members</span>
            </div>
          </div>

          <div style={{marginBottom:24}}>
            <div style={{fontSize:"0.58rem",fontWeight:700,letterSpacing:"0.1em",

            {[["Posts today","84"],["Active now","23"],["DU-wide","1,247"],["Your echoes","3"]].map(([l,v])=>(

            </div>
            {TABS.map(t=>(
              <div key={t.id} onClick={()=>setTab(t.id)}

                  color:tab===t.id?"var(--accent)":"var(--ink2)",
                  fontWeight:tab===t.id?600:400,cursor:"pointer",

                    {followedUsers.size}

                )}
                {t.id==="saved"&&savedPosts.size>0&&(
                  <span style={{fontSize:"0.62rem",background:"var(--blue)",
                    color:"#fff",borderRadius:10,padding:"1px 5px",fontWeight:700}}>
                    {savedPosts.size}
                  </span>
                )}
              </div>
            ))}
          </div>

          {followedUsers.size>0&&(
            <div>
              <div style={{fontSize:"0.58rem",fontWeight:700,letterSpacing:"0.1em",
                textTransform:"uppercase",color:"var(--ink4)",marginBottom:10}}>
                Following
              </div>
              {[...followedUsers].slice(0,5).map(h=>{
                const u=ALL_USERS.find(x=>x.handle===h);
                if(!u)return null;

                  <div key={h} style={{display:"flex",alignItems:"center",gap:7,

                    <div style={{minWidth:0}}>
                      <div style={{fontSize:"0.73rem",fontWeight:600,color:"var(--ink)",
                        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.name}</div>
                      <div style={{fontSize:"0.6rem",color:"var(--ink3)"}}>{u.college}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </aside>

        {/* MAIN FEED */}
        <main style={{padding:"24px 28px",minWidth:0}}>

          {/* compose */}
          <div style={{background:"var(--white)",border:"1px solid var(--border)",
            borderRadius:8,padding:"12px 14px",marginBottom:22}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
              <div style={{width:34,height:34,borderRadius:"50%",background:"#c84b2f",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:"0.62rem",fontWeight:700,color:"#fff",flexShrink:0}}>MP</div>
              <div style={{flex:1}}>
                <MentionInput value={newPostText} onChange={setNewPostText}

              <div style={{marginTop:10,marginLeft:44,

                {pollOpts.map((o,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",
                    borderBottom:i<pollOpts.length-1?"1px solid var(--border2)":"none"}}>
                    <input value={o} onChange={e=>setPollOpts(p=>p.map((v,j)=>j===i?e.target.value:v))}

          {/* search */}
          <div style={{display:"flex",gap:8,marginBottom:18}}>
            <div style={{flex:1,display:"flex",alignItems:"center",gap:8,
              background:"var(--white)",border:"1px solid var(--border)",
              borderRadius:6,padding:"7px 11px"}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="var(--ink4)" strokeWidth="2.2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
              <input value={searchQ} onChange={e=>setSearchQ(e.target.value)}
                placeholder="Search posts, tags, people..."
                style={{border:"none",outline:"none",fontSize:"0.82rem",
                  background:"transparent",color:"var(--ink)",flex:1,fontFamily:"var(--sans)"}}/>
              {searchQ&&<button onClick={()=>setSearchQ("")}
                style={{background:"none",border:"none",color:"var(--ink4)",cursor:"pointer",
                  fontSize:"0.9rem",lineHeight:1}}>×</button>}
            </div>
            <select value={searchCollege} onChange={e=>setSearchCollege(e.target.value)}
              style={{padding:"7px 10px",border:"1px solid var(--border)",borderRadius:6,
                fontSize:"0.78rem",color:"var(--ink2)",background:"var(--white)",
                outline:"none",cursor:"pointer",fontFamily:"var(--sans)"}}>
              <option value="">All colleges</option>
              {COLLEGES.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>

          {/* banner slideshow */}
          {!searchQ&&!searchCollege&&<BannerSlideshow/>}

          {/* empty states */}
          {tab==="following"&&followedUsers.size===0&&!searchQ&&(
            <div style={{textAlign:"center",padding:"3rem 0"}}>
              <div style={{fontFamily:"var(--serif)",fontSize:"1.3rem",
                color:"var(--ink2)",marginBottom:6}}>No one followed yet</div>
              <div style={{fontSize:"0.82rem",color:"var(--ink3)"}}>
                Follow people from any post to see their updates here.
              </div>
            </div>
          )}
          {tab==="saved"&&savedPosts.size===0&&!searchQ&&(
            <div style={{textAlign:"center",padding:"3rem 0"}}>
              <div style={{fontFamily:"var(--serif)",fontSize:"1.3rem",
                color:"var(--ink2)",marginBottom:6}}>Nothing saved</div>
              <div style={{fontSize:"0.82rem",color:"var(--ink3)"}}>
                Save posts from the feed to collect them here.
              </div>
            </div>
          )}

          {visible.map(p=>(
            <PostCard key={p.id} post={p}
              voted={voted[p.id]||null} onVote={handleVote}
              saved={savedPosts.has(p.id)} onSave={handleSave}
              followed={followedUsers.has(p.author.handle)} onFollow={handleFollow}
              onQuote={setQuoteModal} notify={notify}/>
          ))}

          {visible.length===0&&(searchQ||searchCollege)&&(
            <div style={{textAlign:"center",padding:"2rem",color:"var(--ink3)",fontSize:"0.85rem"}}>
              No posts match your search.
            </div>
          )}
        </main>

        {/* RIGHT SIDEBAR */}
        <aside style={{padding:"24px 0 24px 20px",borderLeft:"1px solid var(--border)"}}>
          <div style={{marginBottom:24}}>
            <div style={{fontSize:"0.58rem",fontWeight:700,letterSpacing:"0.1em",
              textTransform:"uppercase",color:"var(--ink4)",marginBottom:12}}>
              Trending at DU
            </div>
            {[["NorthCampus","312 posts"],["PlacementSeason","247 posts"],
              ["EconFest","189 posts"],["DULife","156 posts"],["CentralLibrary","98 posts"]
            ].map(([tag,n],i)=>(
              <div key={tag}
                onClick={()=>setSearchQ(tag)}
                style={{padding:"7px 0",borderBottom:"1px solid var(--border2)",cursor:"pointer"}}
                onMouseEnter={e=>e.currentTarget.style.opacity="0.7"}
                onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                <div style={{fontSize:"0.62rem",color:"var(--ink4)",marginBottom:1}}>{i+1}</div>
                <div style={{fontSize:"0.8rem",fontWeight:600,color:"var(--ink)"}}>#{tag}</div>
                <div style={{fontSize:"0.64rem",color:"var(--ink3)"}}>{n}</div>
              </div>
            ))}
          </div>

          <div style={{marginBottom:24}}>
            <div style={{fontSize:"0.58rem",fontWeight:700,letterSpacing:"0.1em",
              textTransform:"uppercase",color:"var(--ink4)",marginBottom:12}}>
              Who to follow
            </div>
            {ALL_USERS.slice(0,5).map(u=>(
              <div key={u.handle} style={{display:"flex",alignItems:"center",gap:7,
                padding:"7px 0",borderBottom:"1px solid var(--border2)"}}>
                <Avatar initials={u.name.slice(0,2).toUpperCase()} college={u.college} size={26}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:"0.74rem",fontWeight:600,color:"var(--ink)",
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.name}</div>
                  <div style={{fontSize:"0.61rem",color:"var(--ink3)"}}>{u.college}</div>
                </div>
                <button onClick={()=>{handleFollow(u.handle);
                    notify(followedUsers.has(u.handle)?
                      `Unfollowed ${u.handle}`:`Following ${u.handle}`);}}
                  style={{fontSize:"0.66rem",fontWeight:500,padding:"3px 8px",
                    border:"1px solid var(--border)",borderRadius:4,
                    background:"transparent",color:followedUsers.has(u.handle)?"var(--ink4)":"var(--ink2)",
                    flexShrink:0,transition:"all 0.15s"}}>
                  {followedUsers.has(u.handle)?"Following":"Follow"}
                </button>
              </div>
            ))}
          </div>

          <div style={{fontSize:"0.61rem",color:"var(--ink4)",lineHeight:1.75}}>
            <div>Unrest · Built for DU students</div>
            <div>Launching 11 June 2026</div>
            <div style={{marginTop:4,display:"flex",gap:8}}>
              <span style={{cursor:"pointer",textDecoration:"underline"}}>Privacy</span>
              <span style={{cursor:"pointer",textDecoration:"underline"}}>Terms</span>
            </div>
          </div>
        </aside>
      </div>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>

</body>
</html>
