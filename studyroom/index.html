<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Buddy by Unrest</title>
<meta name="description" content="Past papers, exam insights, flashcards and a live study library for DU students.">
<script>try{var t=localStorage.getItem("eb_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --paper:#fff; --soft:#F6F6F9; --ink:#0B0B0F; --mute:#6A6A75; --line:#E7E7EC;
  --accent:#2B4EFF; --ok:#16A34A; --warn:#B45309;
  --serif:'Fraunces',Georgia,serif; --sans:'Bricolage Grotesque',system-ui,sans-serif; --mono:'DM Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
:root{--bg:#fff;--onink:#fff;--onacc:#fff;--line2:#CFCFD8;--dot:rgba(11,11,15,.09);--glass:rgba(255,255,255,.72);--lock:rgba(255,255,255,.82);--halo:rgba(11,11,15,.15);--focus:rgba(11,11,15,.08);--minenick:#9AA8FF;--b1:#DCE5FF;--b2:#EFE2FF;--b3:#D9F4E8;--blobop:.7;color-scheme:light}
:root[data-theme=dark]{--paper:#15151B;--bg:#0B0B0F;--soft:#1C1C24;--ink:#F2F2F6;--mute:#9A9AA6;--line:#2A2A33;--line2:#3A3A46;--accent:#7C93FF;--ok:#22C55E;--warn:#F59E0B;--onink:#0B0B0F;--onacc:#0B0B0F;--dot:rgba(255,255,255,.08);--glass:rgba(11,11,15,.72);--lock:rgba(11,11,15,.82);--halo:rgba(255,255,255,.2);--focus:rgba(255,255,255,.12);--minenick:#2B4EFF;--b1:#1B2A6B;--b2:#3A1F66;--b3:#0F4A33;--blobop:.35;color-scheme:dark}
body,.top,.card,.btn,select,input,textarea,.pill{transition:background-color .3s,color .3s,border-color .3s}
*{box-sizing:border-box;margin:0;font-style:normal !important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
body{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit}
::selection{background:var(--ink);color:var(--onink)}

/* soft moving backdrop */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:26px 26px;
  mask-image:radial-gradient(ellipse at 50% 20%,#000,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000,transparent 75%);animation:dots 18s linear infinite}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blobop);will-change:transform}
.bg i:nth-child(1){width:44vmax;height:44vmax;background:var(--b1);left:-12vmax;top:-16vmax;animation:d1 24s ease-in-out infinite alternate}
.bg i:nth-child(2){width:34vmax;height:34vmax;background:var(--b2);right:-12vmax;top:10vh;animation:d2 30s ease-in-out infinite alternate}
.bg i:nth-child(3){width:30vmax;height:30vmax;background:var(--b3);left:34vw;bottom:-18vmax;animation:d3 27s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(16vmax,10vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-14vmax,-6vmax) scale(.9)}}
@keyframes d3{to{transform:translate(-12vmax,-8vmax) scale(1.2)}}
@keyframes dots{to{background-position:26px 26px}}

/* shell */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5;flex-wrap:wrap;animation:down .8s var(--ease) both}
.brand{font-family:var(--serif);font-weight:800;font-size:22px;text-decoration:none}
.brand span{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--mute)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;padding:6px 14px;border-radius:99px;font-size:14px;color:var(--mute);transition:color .25s,background .25s}
nav a:hover{color:var(--ink);background:var(--soft)}
nav a.on{background:var(--ink);color:var(--onink)}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:32px 24px 64px}
.foot{padding:20px 24px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);text-align:center}

/* entrance motion */
main>*{animation:up .8s var(--ease) both}
main>*:nth-child(2){animation-delay:.08s}
main>*:nth-child(3){animation-delay:.16s}
main>*:nth-child(4){animation-delay:.24s}
.grid>*,.list>*{animation:up .7s var(--ease) both}
.grid>*:nth-child(1),.list>*:nth-child(1){animation-delay:.1s}
.grid>*:nth-child(2),.list>*:nth-child(2){animation-delay:.18s}
.grid>*:nth-child(3),.list>*:nth-child(3){animation-delay:.26s}
.grid>*:nth-child(4),.list>*:nth-child(4){animation-delay:.34s}
.grid>*:nth-child(n+5),.list>*:nth-child(n+5){animation-delay:.42s}
.static>*{animation:none !important}
@keyframes up{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes down{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font-family:var(--serif);font-weight:800;font-size:clamp(40px,7vw,78px);line-height:1.02;letter-spacing:-.03em}
h2{font-family:var(--serif);font-weight:600;font-size:30px;margin-bottom:6px}
h3{font-weight:600;font-size:16px}
.lead{color:var(--mute);max-width:52ch;margin:14px 0 22px;font-size:17px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;overflow:hidden;box-shadow:0 1px 2px rgba(11,11,15,.03);transition:transform .4s var(--ease),border-color .3s,box-shadow .4s var(--ease)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(43,78,255,.07),transparent 70%)}
.card:hover::before{opacity:1}
a.card{text-decoration:none;display:block}
a.card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 40px -18px rgba(20,20,60,.25)}
.card .tag{font-family:var(--mono);font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.card p{color:var(--mute);font-size:14px;margin-top:6px}
.card>*{position:relative}

.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--ink);background:var(--ink);color:var(--onink);padding:9px 18px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .25s var(--ease),box-shadow .3s,background .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(11,11,15,.5)}
.btn:active{transform:scale(.96)}
.btn.alt{background:var(--paper);color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--ink);box-shadow:none}
.btn.acc{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.row.between{justify-content:space-between}
select,input{font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:border-color .25s,box-shadow .25s;outline:none}
select:focus,input:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--focus)}
.banner{background:var(--soft);border:1px dashed var(--line2);padding:10px 14px;border-radius:10px;font-size:13px;color:var(--mute);margin:12px 0}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 11px;color:var(--mute)}
.pill.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:ping 2s ease-in-out infinite}
.pill b{color:var(--ink);font-weight:500}
@keyframes ping{50%{opacity:.35;transform:scale(.7)}}

/* HOME: hero + orbit */
.hero2{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;margin-bottom:36px}
@media(max-width:900px){.hero2{grid-template-columns:1fr}}
.hero2 h1{margin:16px 0 0}
.joinbox{margin-top:6px}
.joinbox form{display:flex;gap:8px;flex-wrap:wrap}
.joinbox input{min-width:200px}
.joinbox small{display:block;margin-top:8px;color:var(--mute);font-size:13px}
.joinbox a{color:var(--ink)}
.orbit{position:relative;width:420px;height:420px;margin:0 auto;max-width:100%}
@media(max-width:900px){.orbit{transform:scale(.85);margin:-30px auto}}
@media(max-width:520px){.orbit{transform:scale(.68);margin:-70px auto}}
.ring{position:absolute;left:50%;top:50%;width:calc(var(--R) * 2);height:calc(var(--R) * 2);margin:calc(var(--R) * -1) 0 0 calc(var(--R) * -1);border:1px dashed var(--line2);border-radius:50%;animation:spin var(--d) linear infinite}
.ring:nth-child(2){animation-direction:reverse}
.dot{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;transform:rotate(var(--a)) translateX(var(--R)) rotate(calc(var(--a) * -1));transition:--a 1s var(--ease)}
.dp{display:block;width:100%;height:100%;animation:pop .7s var(--ease) both}
.dot b{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;font-size:14px;font-weight:600;border:2px solid var(--paper);box-shadow:0 4px 14px -4px rgba(11,11,15,.3);animation:spin var(--d) linear infinite reverse;cursor:default}
.ring:nth-child(2) .dot b{animation-direction:normal}
.dot b.me{border-color:var(--ink)}
.dot.gone{opacity:0;transform:rotate(var(--a)) translateX(var(--R)) rotate(calc(var(--a) * -1)) scale(.3);transition:opacity .4s,transform .4s}
.orbit-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.orbit-core strong{display:block;font-family:var(--serif);font-weight:800;font-size:64px;line-height:1}
.orbit-core span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.orbit-core::before{content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(43,78,255,.12),transparent 70%);animation:breathe 4s ease-in-out infinite;z-index:-1}
@keyframes breathe{50%{transform:scale(1.35);opacity:.5}}

/* HOME: library + common room */
.cols{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.rooms{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.room-card{min-height:150px;display:flex;flex-direction:column}
.rc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.live-n{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.live-n.on{color:var(--ok)}
.live-n i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:ping 2s ease-in-out infinite}
.stack{display:flex;margin-top:auto;padding-top:14px}
.stack b{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:2px solid var(--paper);margin-left:-8px;animation:pop .5s var(--ease) both}
.stack b:first-child{margin-left:0}
.stack b.more{background:var(--soft);color:var(--mute)}
.newroom{display:flex;gap:8px}
.newroom input{width:170px}

/* chat (lobby + room) */
.chat{display:flex;flex-direction:column;height:440px}
.chat h3{margin-bottom:10px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;scroll-behavior:smooth}
.m{font-size:14px;background:var(--soft);padding:7px 11px;border-radius:12px;word-break:break-word;animation:pop .45s var(--ease) both;align-self:flex-start;max-width:92%}
.m b{font-size:12px;color:var(--accent);display:block}
.m.mine{align-self:flex-end;background:var(--ink);color:var(--onink)}
.m.mine b{color:var(--minenick)}
.m.sys{background:transparent;color:var(--mute);font-size:12px;text-align:center;align-self:center}
.chat form{display:flex;gap:8px}
.chat input{flex:1;min-width:0}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.who span{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--soft);animation:pop .4s var(--ease) both}
.who span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;animation:ping 2s ease-in-out infinite}
.lock{position:absolute;inset:0;background:var(--lock);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute);font-size:14px;z-index:2}

/* ROOM */
.room{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:820px){.room{grid-template-columns:1fr}}
.ringwrap{position:relative;width:min(300px,80%);margin:8px auto 4px;aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:6}
.prg{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-dasharray:678.58;transition:stroke-dashoffset .3s linear,stroke .5s}
.prg.brk{stroke:var(--ok)}
.ringwrap.run::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--halo);animation:halo 2.6s ease-out infinite}
@keyframes halo{from{transform:scale(.96);opacity:1}to{transform:scale(1.08);opacity:0}}
.clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:clamp(44px,9vw,64px);font-weight:500;letter-spacing:-.03em}
.phase{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin-top:4px}

/* paper accordion */
.paper{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.paper small{color:var(--mute);font-family:var(--mono);font-size:12px}
.list{display:flex;flex-direction:column;gap:10px}
details.paper{display:block;padding:0}
details.paper summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:18px;position:relative}
details.paper summary::-webkit-details-marker{display:none}
details.paper summary::after{content:"+";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-family:var(--mono);color:var(--ink);font-size:20px;transition:transform .4s var(--ease)}
details.paper[open] summary::after{transform:translateY(-50%) rotate(45deg)}
details.paper summary .btn{margin-right:34px}
.qs{list-style:decimal;padding:0 18px 18px 42px;display:flex;flex-direction:column;gap:12px;animation:up .5s var(--ease) both}
.qs li{padding-left:4px}
.qs li::marker{font-family:var(--mono);color:var(--mute);font-size:13px}
.qs small{display:block;color:var(--accent);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

/* insights */
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.bar i{display:block;height:12px;background:var(--ink);border-radius:99px;min-width:3px;transform-origin:left;animation:grow 1.1s var(--ease) both .3s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar b{font-family:var(--mono);font-weight:500;text-align:right}
.rq{padding:12px 0;border-top:1px solid var(--line)}
.rq:first-child{border-top:0}
.rq small{color:var(--mute);font-family:var(--mono);font-size:12px}

/* flashcards */
.flash{perspective:1200px;margin:20px 0;height:240px;cursor:pointer;animation:up .7s var(--ease) both}
.flash .in{position:relative;width:100%;height:100%;transition:transform .8s var(--ease);transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;border-radius:20px;border:1px solid var(--line);background:var(--paper);box-shadow:0 18px 40px -22px rgba(20,20,60,.3);font-family:var(--serif);font-size:24px}
.face.back{transform:rotateY(180deg);background:var(--ink);border-color:var(--ink);color:var(--onink);font-family:var(--sans);font-size:19px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .6s var(--ease)}

/* course-room tag + suggestion modal */
.tagmine{display:inline-block;align-self:flex-start;margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--onink);border-radius:99px;padding:2px 9px}
.room-card h3{line-height:1.3}
.overlay{position:fixed;inset:0;background:rgba(11,11,15,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .3s ease both}
.modal{width:min(460px,100%);animation:up .5s var(--ease) both}
.modal label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px}
.modal input,.modal textarea{display:block;width:100%;margin-top:6px;color:var(--ink)}
textarea{font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);outline:none;resize:vertical;transition:border-color .25s,box-shadow .25s}
textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--focus)}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* admin */
.aform{display:flex;flex-direction:column;gap:10px}
.areatext{width:100%;font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--ink)}
.atbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.atbl th,.atbl td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.atbl th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:500}
.atbl .warn{color:var(--warn)}

/* footer join */
.foot .btn{margin-bottom:14px}
.foot p{margin:0}

/* header CTA buttons */
.cta{display:flex;gap:8px;flex-wrap:wrap}
.cta .btn{padding:7px 14px;white-space:nowrap}
@media(max-width:700px){.cta{width:100%}.cta .btn{flex:1;text-align:center}}

/* square library rooms (placed after .card so it wins) */
.room-card{border-radius:0}
.tagmine{border-radius:0}

/* live "PYQs added" badge */
.nbadge{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:2px 9px;border-radius:99px;background:var(--accent);color:var(--onacc);font-family:var(--mono);font-size:11px;position:relative;overflow:hidden;animation:pop .5s var(--ease) both}
.nbadge[hidden]{display:none}
.nbadge i{width:6px;height:6px;border-radius:50%;background:var(--onacc);animation:ping 1.6s ease-in-out infinite}
.nbadge::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3s ease-in-out infinite}
.nbadge.bump{animation:bump .6s var(--ease)}
@keyframes shine{60%,100%{transform:translateX(120%)}}
@keyframes bump{30%{transform:scale(1.3)}}

::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<header class="top">
  <a href="https://unrestdu.in/" style="font-size:13px;font-weight:600;text-decoration:none;color:var(--mute)">← Unrest</a>
  <a class="brand" href="#/">Exam Buddy<span> by Unrest</span></a>
  <nav id="nav">
    <a href="#/">Study together</a>
    <a href="#/pyqs">PYQs<span class="nbadge" id="pyq-badge" hidden></span></a>
    <a href="#/insights">Insights</a>
    <a href="#/flashcards">Flashcards</a>
  </nav>

/* ---------- realtime transport (Firebase, Supabase, or same-browser demo) ---------- */
function makeTransport(name, nick, h, meta = {}) {
  const id = nick.replace(/[^A-Za-z0-9]/g, '').slice(0, 10) + '-' + Math.random().toString(36).slice(2, 6);
  let cur = { id, nick, ...meta };
  const handle = (ev, p, mine) => {
    if (ev === 'msg') h.onMsg && h.onMsg(p, mine);
    else if (ev === 'timer') h.onTimer && h.onTimer(p);
    else if (ev === 'hello') h.onHello && h.onHello();
  };
  const clean = arr => arr.map(x => ({ id: x.id, nick: String(x.nick || '?').slice(0, 20), room: x.room || null, rname: x.rname || null }));

  if (FB) {
    // Events older than the join time are replayed only for chat, so latecomers see recent messages but not stale timers.
    const uid = firebase.auth().currentUser.uid, TS = firebase.database.ServerValue.TIMESTAMP;
    const pRef = FB.ref('studyroom/presence/' + name + '/' + uid + '_' + id.split('-').pop());
    const pAll = FB.ref('studyroom/presence/' + name), evRef = FB.ref('studyroom/events/' + name);
    const since = Date.now() + SKEW;
    const q = evRef.orderByChild('t').startAt(since - 10 * 60000);
    let online = false, ready = false;
    const put = () => pRef.set({ ...cur, t: TS }).catch(() => {});
    const send = (ev, p) => {
      const e = { ev, u: uid, s: id, t: TS };
      if (p && Object.keys(p).length) e.p = typeof p.endsAt === 'number' ? { ...p, endsAt: p.endsAt + SKEW } : p;
      evRef.push(e).catch(() => {});
    };
    const onConn = FB.ref('.info/connected').on('value', s => {
      online = !!s.val(); if (!online) return;
      pRef.onDisconnect().remove(); put();
      if (!ready) { ready = true; send('hello', {}); h.onReady && h.onReady(true); }
    });
    const onPres = pAll.on('value', s => {
      const all = s.val() || {};
      if (online && !all[pRef.key]) put();
      h.onPresence && h.onPresence(clean(Object.values(all)));
    });
    const onEv = q.on('child_added', s => {
      const e = s.val() || {}, p = e.p || {};
      if (e.s === id) return;
      if (e.t < since) { if (e.ev === 'msg') handle('msg', p, e.u === uid); return; }
      handle(e.ev, typeof p.endsAt === 'number' ? { ...p, endsAt: p.endsAt - SKEW } : p);
    });
    evRef.orderByChild('t').endAt(since - 10 * 60000).limitToFirst(50).once('value', s => s.forEach(c => { c.ref.remove().catch(() => {}); }));
    return {
      id,
      send,
      track: m => { cur = { ...cur, ...m }; if (online) put(); },
      close: () => {
        FB.ref('.info/connected').off('value', onConn); pAll.off('value', onPres); q.off('child_added', onEv);
        pRef.onDisconnect().cancel(); pRef.remove().catch(() => {});
      }
    };
  }

  if (SB) {
    const ch = SB.channel(name, { config: { broadcast: { self: false }, presence: { key: id } } });
    let subscribed = false;
    ['msg', 'timer', 'hello'].forEach(ev => ch.on('broadcast', { event: ev }, ({ payload }) => handle(ev, payload)));
    ch.on('presence', { event: 'sync' }, () => h.onPresence && h.onPresence(clean(Object.values(ch.presenceState()).flat())));
    ch.subscribe(async st => {
      if (st === 'SUBSCRIBED') {
        subscribed = true;
        await ch.track(cur);
        ch.send({ type: 'broadcast', event: 'hello', payload: {} });
        h.onReady && h.onReady(true);
      }
    });
    return {
      id,
      send: (ev, payload) => ch.send({ type: 'broadcast', event: ev, payload }),
      track: m => { cur = { ...cur, ...m }; if (subscribed) Promise.resolve(ch.track(cur)).catch(() => {}); },
      close: () => SB.removeChannel(ch)
    };
  }

  // demo mode: tabs of the same browser only
  const bc = new BroadcastChannel('exambuddy:' + name);
  const peers = {};
  const emit = () => h.onPresence && h.onPresence(clean([cur, ...Object.values(peers)]));
  const beat = () => bc.postMessage({ ev: 'hb', p: cur });
  bc.onmessage = e => {
    const { ev, p } = e.data;
    if (ev === 'hb') { peers[p.id] = { ...p, seen: Date.now() }; emit(); }
    else if (ev === 'bye') { delete peers[p.id]; emit(); }
    else if (ev === 'hello') { beat(); handle('hello'); }
    else handle(ev, p);
  };
  const t = setInterval(() => {
    beat();
    const now = Date.now(); let changed = false;
    for (const k in peers) if (now - peers[k].seen > 9000) { delete peers[k]; changed = true; }
    if (changed) emit();
  }, 3000);
  const bye = () => bc.postMessage({ ev: 'bye', p: { id } });
  window.addEventListener('beforeunload', bye);
  bc.postMessage({ ev: 'hello', p: {} }); beat();
  setTimeout(() => { emit(); h.onReady && h.onReady(false); }, 0);
  return {
    id,
    send: (ev, p) => bc.postMessage({ ev, p }),
    track: m => { cur = { ...cur, ...m }; beat(); emit(); },
    close: () => { clearInterval(t); bye(); window.removeEventListener('beforeunload', bye); bc.close(); }
  };
}

/* ---------- lobby: one live channel for whole session ---------- */
const Lobby = { ch: null, users: [], msgs: [], subs: new Set(), live: false, ready: false, nick: '' };
const lobEmit = (t, p) => Lobby.subs.forEach(f => f(t, p));
function lobbyStart(nick) {
  if (Lobby.ch) return;
  Lobby.nick = nick;
  Lobby.ch = makeTransport('lobby', nick, {
    onMsg: (p, mine) => pushLobbyMsg({ n: String(p.n || '?').slice(0, 20), t: String(p.t || '').slice(0, 300), mine }),
    onPresence: l => { Lobby.users = l; lobEmit('presence'); },
    onReady: live => { Lobby.live = live; Lobby.ready = true; lobEmit('ready'); }
  });
}
function pushLobbyMsg(m) {
  Lobby.msgs.push(m);
  if (Lobby.msgs.length > 80) Lobby.msgs.shift();
  lobEmit('msg', m);
}
const lobbySay = t => { pushLobbyMsg({ n: Lobby.nick, t, mine: true }); Lobby.ch.send('msg', { n: Lobby.nick, t }); };
const lobbyRoom = (id, name) => { if (Lobby.ch) Lobby.ch.track({ room: id, rname: name }); };

/* ---------- study-profile backend ---------- */
async function boot() {
  try {
    const [c, d] = await Promise.all([getJSON('data/courses.json'), getJSON('data/decks.json')]);
    COURSES = c.courses; DECKS = d.decks;
  } catch (e) { view.innerHTML = '<p class="lead">Could not load data. Serve via a web server, not file://.</p>'; return; }

  if (window.firebase) {
    try {
      firebase.initializeApp(FB_CONFIG);
      const auth = firebase.auth();
      await new Promise(res => { const off = auth.onAuthStateChanged(u => { off(); res(u); }); });
      if (!auth.currentUser) await auth.signInAnonymously();
      FB = firebase.database();
      FB.ref('.info/serverTimeOffset').on('value', s => { SKEW = s.val() || 0; });
    } catch (e) { console.warn('Firebase unavailable, demo mode', e); FB = null; }
  }

  if (window.SUPABASE_URL && window.SUPABASE_KEY && window.supabase) {
    try {
      SB = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
      const { data: { session } } = await SB.auth.getSession();
      if (!session) await SB.auth.signInAnonymously();
      try { const { data: a } = await SB.from('admins').select('user_id').maybeSingle(); IS_ADMIN = !!a; } catch (e) {}
      const { data } = await SB.from('profiles').select('course_id,year').maybeSingle();
      if (data) PROFILE = { courseId: data.course_id, year: data.year };
    } catch (e) { console.warn('Supabase unavailable, demo mode', e); SB = null; }
  }
  if (!PROFILE && !SB) { try { PROFILE = JSON.parse(localStorage.getItem(LS_PROFILE) || 'null'); } catch (e) {} }
  if (PROFILE && !course()) PROFILE = null;
  if (PROFILE) await loadPapers();
  if (SB && PROFILE) SB.channel('papers-feed')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'papers' }, async () => { await loadPapers(); updateBadge(true); })
    .subscribe();
  if (getNick()) lobbyStart(getNick());
  window.addEventListener('hashchange', route);
  route();
}

async function loadPapers() {
  if (SB) {
    // Row level security returns only my course + my semesters.
    let r = await SB.from('papers').select('id,course_id,semester,subject,year,url,created_at,questions(q,topic,marks)');
    if (r.error) r = await SB.from('papers').select('id,course_id,semester,subject,year,url,questions(q,topic,marks)');
    if (r.error) { console.warn(r.error); PAPERS = []; return; }
    PAPERS = r.data.map(p => ({ id: p.id, courseId: p.course_id, semester: p.semester, subject: p.subject, year: p.year, url: p.url || '#', added: p.created_at, questions: p.questions || [] }));
  } else {
    PAPERS = (await getJSON('data/papers.json')).papers; // demo: filtered in browser, not secure
  }
  const sems = mySems();
  PAPERS = PAPERS.filter(p => p.courseId === PROFILE.courseId && sems.includes(p.semester));
}

async function saveProfile(courseId, year) {
  if (SB) {
    const { data: { user } } = await SB.auth.getUser();
    const { error } = await SB.from('profiles').upsert({ user_id: user.id, course_id: courseId, year });
    if (error) return error.message;
  } else {
    try { localStorage.setItem(LS_PROFILE, JSON.stringify({ courseId, year })); } catch (e) {}
  }
  PROFILE = { courseId, year };
  await loadPapers();
  updateBadge();
  return null;
}

      home();
    };

  /* orbit (diffed so dots glide instead of restarting) */
  const dots = new Map();
  const paintOrbit = () => {
    const users = Lobby.users, meId = Lobby.ch && Lobby.ch.id;
    const ids = new Set(users.map(u => u.id));
    dots.forEach((el, id) => { if (!ids.has(id)) { el.classList.add('gone'); setTimeout(() => el.remove(), 450); dots.delete(id); } });
    const groups = [[], [], []];
    users.forEach(u => groups[hash(u.id) % 3].push(u));
    groups.forEach((g, ri) => {
      g.sort((a, b) => a.id < b.id ? -1 : 1);
      g.forEach((u, k) => {
        let el = dots.get(u.id);
        if (!el) {
          el = document.createElement('span'); el.className = 'dot';
          el.innerHTML = '<span class="dp"><b></b></span>';
          $('#ring' + ri).appendChild(el); dots.set(u.id, el);
        }
        const b = el.querySelector('b'), hu = hash(u.nick) % 360;
        b.textContent = (u.nick[0] || '?').toUpperCase();
        b.style.background = `hsl(${hu} 85% 90%)`; b.style.color = `hsl(${hu} 45% 28%)`;
        b.classList.toggle('me', u.id === meId);
        const rinfo = u.room && roomInfo(u.room);
        el.title = u.nick + (rinfo ? ' studying in ' + rinfo.name : ' in the lobby');
        el.style.setProperty('--a', (k * 360 / g.length + ri * 47) + 'deg');
      });
    });
    $('#core-n').textContent = users.length;
  };

  const paintStats = () => {
    $('#st-on').textContent = Lobby.users.length;
    $('#st-study').textContent = Lobby.users.filter(u => u.room).length;
    const m = $('#mode');
    if (Lobby.ready) { m.hidden = false; m.textContent = Lobby.live ? 'Live' : 'Demo: this browser only'; }
  };

  const paintRooms = () => {
    const info = {};
    BASE_ROOMS.forEach(r => info[r.id] = { ...r, members: [] });
    Lobby.users.forEach(u => { if (u.room && info[u.room]) info[u.room].members.push(u.nick); });
    const box = $('#rooms');
    if (box.dataset.painted) box.classList.add('static');
    box.dataset.painted = '1';
    box.innerHTML = Object.values(info).map(r => `<a class="card room-card" href="#/room/${esc(r.id)}">
      <div class="rc-top"><h3>${esc(r.name)}</h3><span class="live-n ${r.members.length ? 'on' : ''}">${r.members.length ? '<i></i>' + r.members.length + ' studying' : 'Empty'}</span></div>
      ${PROFILE && PROFILE.courseId === r.id ? '<span class="tagmine">Your course</span>' : ''}${r.desc ? `<p>${esc(r.desc)}</p>` : ''}
      <div class="stack">${r.members.slice(0, 5).map(n => `<b ${avatar(n)}>${esc((n[0] || '?').toUpperCase())}</b>`).join('')}${r.members.length > 5 ? `<b class="more">+${r.members.length - 5}</b>` : ''}</div>
    </a>`).join('');
  };

  const paintWho = () => {
    const w = $('#lwho');
    w.classList.toggle('static', !!w.dataset.painted); w.dataset.painted = '1';
    w.innerHTML = uniq(Lobby.users.map(u => u.nick)).slice(0, 30).map(n => `<span>${esc(n)}</span>`).join('');
  };

  const msgs = $('#lmsgs');
  const addMsg = m => {
    msgs.insertAdjacentHTML('beforeend', `<div class="m ${m.mine ? 'mine' : ''}"><b>${esc(m.mine ? 'You' : m.n)}</b>${esc(m.t)}</div>`);
    msgs.scrollTop = msgs.scrollHeight;
  };
  if (!Lobby.msgs.length) msgs.innerHTML = '<div class="m sys">Nobody has said anything yet. Be the first.</div>';
  else Lobby.msgs.forEach(addMsg);

  const sub = (t, p) => {
    if (t === 'msg') { const s = msgs.querySelector('.sys'); if (s) s.remove(); addMsg(p); }
    else { paintRooms(); paintOrbit(); paintWho(); paintStats(); }
  };
  Lobby.subs.add(sub);
  paintRooms(); paintOrbit(); paintWho(); paintStats();
  lobbyRoom(null, null);

  let last = 0;
  $('#lf').onsubmit = e => {
    e.preventDefault();
    const t = $('#li').value.trim();
    if (!t || !Lobby.ch || Date.now() - last < 700) return;
    last = Date.now(); lobbySay(t); $('#li').value = '';
  };
  $('#addroom').onclick = openSuggest;
  cleanup = () => Lobby.subs.delete(sub);
}

async function saveSuggestion(courseName, note) {
  const nick = getNick() || null;
  if (FB) {
    const s = { course: courseName, u: firebase.auth().currentUser.uid, t: firebase.database.ServerValue.TIMESTAMP };
    if (note) s.note = note;
    if (nick) s.nick = nick;
    try { await FB.ref('studyroom/suggestions').push(s); return null; } catch (e) { return 'Could not send. Try again later.'; }
  }
  if (SB) {
    const { error } = await SB.from('room_suggestions').insert({ course_name: courseName, note: note || null, nick });
    return error ? 'Could not send. Try again later.' : null;
  }
  try { // demo: kept on this device only
    const a = JSON.parse(localStorage.getItem('eb_suggestions') || '[]');
    a.push({ course: courseName, note, nick, at: Date.now() });
    localStorage.setItem('eb_suggestions', JSON.stringify(a));
  } catch (e) {}
  return null;
}

/* ---------- ROOM ---------- */
function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 660; g.gain.value = .15;
    o.start(); o.stop(a.currentTime + .35);
  } catch (e) {}
}

function room(id) {
  if (!id) return home();
  const r = roomInfo(id);
  if (!r) { location.hash = '#/'; return; }
  const nick = getNick();
  if (!nick) {
    view.innerHTML = `<h2>${esc(r.name)}</h2><p class="lead">Pick a display name to join. No signup.</p>
      <form class="row" id="nf"><input id="nn" maxlength="20" placeholder="Your name" required><button class="btn">Join room</button></form>`;
    $('#nf').onsubmit = e => {
      e.preventDefault();
      const n = $('#nn').value.trim().slice(0, 20); if (!n) return;
      setNick(n); lobbyStart(n); room(id);
    };
    return;
  }
  lobbyStart(nick);
  lobbyRoom(id, r.name);

  const CIRC = 678.58;
  const T = { phase: 'focus', running: false, endsAt: 0, remaining: 25 * 60000, focus: 25, brk: 5 };
  view.innerHTML = `<div class="row between" style="margin-top:0"><div><h2>${esc(r.name)}</h2><span class="pill" id="mode">Connecting</span></div>
      <div class="row" style="margin:0"><button class="btn alt" id="cp">Copy invite link</button><a class="btn alt" href="#/">Leave</a></div></div>
    <div class="room">
      <div class="card">
        <div class="ringwrap" id="rw"><svg viewBox="0 0 240 240"><circle class="trk" cx="120" cy="120" r="108"/><circle class="prg" id="prg" cx="120" cy="120" r="108"/></svg>
          <div class="clock"><span id="clock">25:00</span><span class="phase" id="phase"></span></div></div>
        <div class="row" style="justify-content:center">
          <button class="btn" id="go">Start</button><button class="btn alt" id="rs">Reset</button>
          <select id="pre"><option value="25,5">25 / 5</option><option value="50,10">50 / 10</option><option value="90,15">90 / 15</option></select>
        </div>
        <div class="who" id="who"></div>
      </div>
      <div class="card chat"><h3>Room chat</h3><div class="msgs" id="msgs"></div>
        <form id="cf"><input id="ci" maxlength="300" placeholder="Say something" autocomplete="off"><button class="btn">Send</button></form></div>
    </div>`;

  const msgs = $('#msgs');
  const sys = t => { msgs.insertAdjacentHTML('beforeend', `<div class="m sys">${esc(t)}</div>`); msgs.scrollTop = msgs.scrollHeight; };
  const add = (n, t, mine) => { msgs.insertAdjacentHTML('beforeend', `<div class="m ${mine ? 'mine' : ''}"><b>${esc(mine ? 'You' : n)}</b>${esc(t)}</div>`); msgs.scrollTop = msgs.scrollHeight; };

  const net = makeTransport('room:' + id, nick, {
    onMsg: (p, mine) => add(String(p.n || '?').slice(0, 20), String(p.t || '').slice(0, 300), mine),
    onTimer: p => { Object.assign(T, p); draw(); },
    onHello: () => { if (T.running) net.send('timer', T); },
    onPresence: list => { const w = $('#who'); if (w) w.innerHTML = uniq(list.map(u => u.nick)).map(n => `<span>${esc(n)}</span>`).join(''); },
    onReady: live => { $('#mode').textContent = live ? 'Live' : 'Demo: this browser only'; sys('Joined as ' + nick); }
  });

  const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const total = () => (T.phase === 'focus' ? T.focus : T.brk) * 60000;
  function draw() {
    const left = T.running ? Math.max(0, T.endsAt - Date.now()) : T.remaining;
    $('#clock').textContent = fmt(left);
    $('#phase').textContent = T.phase === 'focus' ? 'Focus' : 'Break';
    $('#go').textContent = T.running ? 'Pause' : 'Start';
    $('#rw').classList.toggle('run', T.running);
    const p = $('#prg'); p.classList.toggle('brk', T.phase === 'break');
    p.style.strokeDashoffset = String(CIRC * (1 - Math.min(1, left / total())));
    document.title = (T.running ? fmt(left) + ' / ' : '') + 'Exam Buddy by Unrest';
  }
  const push = () => { net.send('timer', T); draw(); };
  $('#go').onclick = () => {
    if (T.running) { T.remaining = T.endsAt - Date.now(); T.running = false; }
    else { T.endsAt = Date.now() + T.remaining; T.running = true; }
    push();
  };
  $('#rs').onclick = () => { T.running = false; T.phase = 'focus'; T.remaining = T.focus * 60000; push(); };
  $('#pre').onchange = e => {
    const [f, b] = e.target.value.split(',').map(Number);
    T.focus = f; T.brk = b; T.running = false; T.phase = 'focus'; T.remaining = f * 60000; push();
  };
  $('#cp').onclick = () => {
    const url = location.href.split('#')[0] + '#/room/' + id;
    const done = () => { $('#cp').textContent = 'Copied'; setTimeout(() => { const b = $('#cp'); if (b) b.textContent = 'Copy invite link'; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, done); else done();
  };
  $('#cf').onsubmit = e => {
    e.preventDefault();
    const t = $('#ci').value.trim(); if (!t) return;
    add(nick, t, true); net.send('msg', { n: nick, t }); $('#ci').value = '';
  };
  const tick = setInterval(() => {
    if (T.running && Date.now() >= T.endsAt) {
      T.phase = T.phase === 'focus' ? 'break' : 'focus';
      T.running = false;
      T.remaining = total();
      beep(); sys(T.phase === 'break' ? 'Time for a break.' : 'Back to focus.');
    }
    draw();
  }, 250);
  draw();
  cleanup = () => { clearInterval(tick); net.close(); lobbyRoom(null, null); document.title = 'Exam Buddy by Unrest'; };
}

function deck(id) {
  const d = DECKS.find(x => x.id === id);
  if (!d) return flashcards();
  let i = 0, got = 0, order = [...d.cards].sort(() => Math.random() - .5);
  const draw = () => {
    if (i >= order.length) {
      view.innerHTML = `<h2>${esc(d.name)}</h2><div class="card"><h1>${got}/${order.length}</h1><p class="lead">Cards you knew.</p>
        <div class="row"><button class="btn" id="again">Go again</button><a class="btn alt" href="#/flashcards">All decks</a></div></div>`;
      $('#again').onclick = () => { i = 0; got = 0; order.sort(() => Math.random() - .5); draw(); };
      return;
    }
    const c = order[i];
    view.innerHTML = `<h2>${esc(d.name)}</h2><div class="prog"><i style="width:${i / order.length * 100}%"></i></div>
      <div class="flash" id="fl"><div class="in"><div class="face">${esc(c.q)}</div><div class="face back">${esc(c.a)}</div></div></div>
      <div class="row"><button class="btn alt" id="no">Again</button><button class="btn" id="yes">Got it</button><span class="pill">${i + 1} / ${order.length}</span></div>`;
    $('#fl').onclick = () => $('#fl').classList.toggle('flip');
    $('#yes').onclick = () => { got++; i++; draw(); };
    $('#no').onclick = () => { i++; draw(); };
  };
  draw();
}

const ADMIN_EXAMPLE = `State and prove Rolle's theorem. | Mean Value Theorems | 6
Find the nth derivative of y = e^(ax) sin(bx). | Successive Differentiation | 6
Trace the curve y^2(a - x) = x^3. | Curve Tracing | 8
Evaluate the limit of (sin x - x)/x^3 as x tends to 0.`;

// One question per line: question | topic | marks. Topic and marks are optional. Leading "1." "Q2)" numbering is stripped.
function parseQs(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    l = l.replace(/^(?:q(?:uestion)?\s*)?\d{1,3}\s*[.):\-]\s+/i, '');
    const parts = l.split('|').map(x => x.trim());
    let topic = '', marks = null;
    if (parts.length === 2) { if (/^\d+$/.test(parts[1])) marks = Number(parts[1]); else topic = parts[1]; }
    else if (parts.length >= 3) { topic = parts[1]; if (/^\d+$/.test(parts[2])) marks = Number(parts[2]); }
    return { q: parts[0], topic, marks };
  }).filter(x => x.q.length >= 5);
}

          <input id="ae" type="email" placeholder="Email" required autocomplete="username">
          <input id="ap" type="password" placeholder="Password" required autocomplete="current-password">
          <div class="row" style="margin:0"><button class="btn">Log in</button><span class="pill" id="am" hidden></span></div>
        </form>`);
    if (signed) { $('#ao').onclick = adminOut; return; }
    $('#al').onsubmit = async e => {
      e.preventDefault();
      const { error } = await SB.auth.signInWithPassword({ email: $('#ae').value.trim(), password: $('#ap').value });
      if (error) { const m = $('#am'); m.hidden = false; m.textContent = 'Wrong email or password.'; return; }
      location.reload();
    };
    return;
  }

  const thisYear = new Date().getFullYear();
  view.innerHTML = `<div class="row between" style="margin-top:0"><h2>Add questions</h2><button class="btn alt" id="ao" type="button">Log out</button></div>
    <div class="card aform">
      <div class="row" style="margin:0">
        <select id="a-c">${COURSES.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>
        <select id="a-s">${[1,2,3,4,5,6,7,8].map(n => `<option value="${n}">Semester ${n}</option>`).join('')}</select>
        <input id="a-sub" list="a-subs" placeholder="Subject" maxlength="80" style="flex:1;min-width:180px">
        <datalist id="a-subs"></datalist>
        <input id="a-y" type="number" min="2000" max="2100" value="${thisYear}" style="width:100px" aria-label="Exam year">
      </div>
      <input id="a-u" type="url" placeholder="Original PDF link (optional)">
      <textarea id="a-t" class="areatext" rows="12" placeholder="${esc(ADMIN_EXAMPLE)}"></textarea>
      <p class="lead" style="margin:0;font-size:14px">One question per line. Format: <b>question | topic | marks</b>. Topic and marks are optional.</p>
      <div class="row" style="margin:0"><button class="btn alt" id="a-p" type="button">Preview</button><button class="btn" id="a-go" type="button" disabled>Publish</button><span class="pill" id="a-m" hidden></span></div>
      <div id="a-prev"></div>
    </div>
    <h3 style="margin:28px 0 10px">Published papers</h3>
    <div class="list" id="a-list"></div>`;

  $('#ao').onclick = adminOut;
  const cSel = $('#a-c'), sSel = $('#a-s');
  const fillSubs = () => {
    const c = COURSES.find(x => x.id === cSel.value);
    $('#a-subs').innerHTML = ((c && c.subjects[sSel.value]) || []).map(n => `<option value="${esc(n)}">`).join('');
  };
  cSel.onchange = sSel.onchange = fillSubs; fillSubs();

  let parsed = [];
  const say = t => { const m = $('#a-m'); m.hidden = !t; m.textContent = t || ''; };
  const preview = () => {
    parsed = parseQs($('#a-t').value);
    const none = parsed.filter(x => !x.topic).length;
    $('#a-prev').innerHTML = parsed.length
      ? `<p class="lead" style="margin:12px 0 0">${parsed.length} question${parsed.length > 1 ? 's' : ''}${none ? ` <span class="warn" style="color:var(--warn)">/ ${none} without a topic (saved as Uncategorised)</span>` : ''}</p>
         <table class="atbl"><tr><th>#</th><th>Question</th><th>Topic</th><th>Marks</th></tr>${parsed.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.q)}</td><td${x.topic ? '' : ' class="warn"'}>${esc(x.topic || 'none')}</td><td>${x.marks == null ? '' : x.marks}</td></tr>`).join('')}</table>`
      : '<p class="lead">No questions found. One question per line.</p>';
    $('#a-go').disabled = !parsed.length;
    say('');
  };
  $('#a-p').onclick = preview;
  $('#a-t').oninput = () => { $('#a-go').disabled = true; };

  const loadList = async () => {
    const box = $('#a-list');
    let r = await SB.from('papers').select('id,course_id,semester,subject,year,created_at,questions(count)').order('created_at', { ascending: false }).limit(40);
    if (r.error) r = await SB.from('papers').select('id,course_id,semester,subject,year,questions(count)').limit(40);
    if (r.error) { box.innerHTML = '<p class="lead">Could not load papers.</p>'; return; }
    box.innerHTML = r.data.map(p => {
      const n = p.questions && p.questions[0] ? p.questions[0].count : null;
      const c = COURSES.find(x => x.id === p.course_id);
      return `<div class="card paper"><span><h3>${esc(p.subject)} ${esc(p.year)}</h3><small>${esc(c ? c.short : p.course_id)} / Sem ${esc(p.semester)}${n != null ? ' / ' + n + ' questions' : ''}</small></span><button class="btn alt" data-del="${esc(p.id)}" type="button">Delete</button></div>`;
    }).join('') || '<p class="lead">Nothing published yet.</p>';
  };
  $('#a-list').onclick = async e => {
    const b = e.target.closest('[data-del]');
    if (!b || !confirm('Delete this paper and all its questions?')) return;
    b.disabled = true;
    const { error } = await SB.rpc('admin_delete_paper', { p_id: b.dataset.del });
    if (error) { alert(error.message); b.disabled = false; return; }
    loadList();
  };

  $('#a-go').onclick = async () => {
    preview();
    const sub = $('#a-sub').value.trim(), y = Number($('#a-y').value), s = Number(sSel.value), c = cSel.value, u = $('#a-u').value.trim();
    if (!parsed.length) return say('Add questions first.');
    if (sub.length < 2) return say('Add the subject.');
    if (!(y >= 2000 && y <= 2100)) return say('Check the year.');
    const go = $('#a-go'); go.disabled = true; say('Publishing');
    const call = rep => SB.rpc('admin_add_paper', { p_course: c, p_semester: s, p_subject: sub, p_year: y, p_url: u || null, p_questions: parsed, p_replace: rep });
    let { error } = await call(false);
    if (error && /exists/i.test(error.message)) {
      if (confirm(`${sub} ${y} already exists for this course and semester. Replace it?`)) ({ error } = await call(true));
      else { go.disabled = false; return say('Cancelled.'); }
    }
    if (error) { go.disabled = false; return say('Failed: ' + error.message); }
    say('Published ' + parsed.length + ' questions.');
    $('#a-t').value = ''; $('#a-prev').innerHTML = ''; parsed = [];
    loadList();
  };
  loadList();
}

/* cursor glow on cards */
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.card');
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  c.style.setProperty('--my', (e.clientY - r.top) + 'px');
});

/* ---------- router ---------- */
function route() {
  if (cleanup) { cleanup(); cleanup = null; }
  const [, name, arg] = (location.hash || '#/').split('/');
  if ((name === 'pyqs' || name === 'insights') && !PROFILE) { location.hash = '#/onboard'; return; }
  const key = (!name || name === 'room' || name === 'library') ? '' : name;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#/' + key));
  window.scrollTo(0, 0);
  if (name === 'onboard') onboard();
  else if (name === 'pyqs') pyqs();
  else if (name === 'insights') insights();
  else if (name === 'flashcards') arg ? deck(arg) : flashcards();
  else if (name === 'room') room(arg);
  else if (name === 'admin') admin();
  else home();
  updateBadge();
}

/* ---------- dark mode ---------- */
const syncTheme = () => { $('#theme').textContent = document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark'; };
$('#theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('eb_theme', t); } catch (e) {}
  syncTheme();
};
syncTheme();

boot();
</script>
</body>
</html>
