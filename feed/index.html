<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Unrest Feed</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f2efe8;
      overflow:hidden;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState } = React;

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap');

*{
  box-sizing:border-box;
}

:root{
  --paper:#f3f0ea;
  --white:#ffffff;
  --ink:#111111;
  --ink2:#444;
  --ink3:#777;
  --ink4:#aaa39a;
  --border:rgba(0,0,0,0.07);
  --accent:#c84b2f;
  --serif:'Instrument Serif', serif;
  --sans:'DM Sans', sans-serif;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
}

button,input{
  font-family:var(--sans);
}

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-thumb{
  background:rgba(0,0,0,0.12);
  border-radius:999px;
}
`;

const EXPLORE_TILES = [
  "Surveys",
  "About DU",
  "Tech",
  "AI",
  "Fashion",
  "Automation",
  "Theatre",
  "Photography",
  "Sports",
  "Case Competitions"
];

const POSTS = [
  {
    id:1,
    name:"Rohan Mehta",
    college:"Hindu College",
    initials:"RM",
    text:"North Campus is genuinely unbeatable in winters. The chai stalls, the cold fog, the DTC chaos — people who say South Campus is better have never experienced this.",
    time:"2h ago"
  },
  {
    id:2,
    name:"Priya Sharma",
    college:"Lady Shri Ram",
    initials:"PS",
    text:"Placement season is doing something weird to people. Everyone suddenly joined three consulting clubs.",
    time:"4h ago"
  }
];

function Avatar({ initials }){
  return(
    <div style={{
      width:"40px",
      height:"40px",
      borderRadius:"50%",
      background:"var(--accent)",
      color:"#fff",
      display:"flex",
      alignItems:"center",
      justifyContent:"center",
      fontSize:"0.72rem",
      fontWeight:"700",
      flexShrink:0
    }}>
      {initials}
    </div>
  )
}

function Banner(){
  return(
    <div style={{
      background:"#f8e8b5",
      borderRadius:"16px",
      padding:"24px",
      height:"140px",
      position:"relative",
      overflow:"hidden",
      marginBottom:"24px"
    }}>
      <div style={{
        position:"absolute",
        right:"-30px",
        top:"-30px",
        width:"160px",
        height:"160px",
        borderRadius:"50%",
        background:"rgba(196,122,0,0.08)"
      }}/>

      <div style={{
        fontFamily:"var(--serif)",
        fontSize:"2.2rem",
        lineHeight:"1",
        fontStyle:"italic",
        color:"#3d2800"
      }}>
        end semester
        <br/>
        exams incoming
      </div>

      <div style={{
        position:"absolute",
        bottom:"18px",
        right:"18px",
        fontSize:"0.65rem",
        letterSpacing:"0.08em",
        textTransform:"uppercase",
        color:"#c47a00",
        fontWeight:"700"
      }}>
        Academics
      </div>
    </div>
  )
}

function PostCard({ post }){
  return(
    <div style={{
      background:"#f7f4ee",
      border:"1px solid rgba(0,0,0,0.05)",
      borderRadius:"16px",
      padding:"22px",
      marginBottom:"16px"
    }}>
      <div style={{
        display:"flex",
        gap:"14px"
      }}>

        <Avatar initials={post.initials}/>

        <div style={{flex:1}}>

          <div style={{
            display:"flex",
            alignItems:"center",
            gap:"8px",
            marginBottom:"6px"
          }}>
            <span style={{
              fontWeight:"700",
              fontSize:"1rem"
            }}>
              {post.name}
            </span>

            <span style={{
              fontSize:"0.72rem",
              color:"var(--ink3)"
            }}>
              {post.college}
            </span>

            <span style={{
              fontSize:"0.72rem",
              color:"var(--ink4)"
            }}>
              · {post.time}
            </span>
          </div>

          <p style={{
            margin:0,
            fontSize:"1rem",
            lineHeight:"1.8",
            color:"var(--ink)"
          }}>
            {post.text}
          </p>

          <div style={{
            display:"flex",
            gap:"18px",
            marginTop:"16px",
            color:"var(--ink3)",
            fontSize:"0.78rem"
          }}>
            <span>W</span>
            <span>L</span>
            <span>comments</span>
            <span>save</span>
          </div>

        </div>

      </div>
    </div>
  )
}

function ExploreTiles(){
  return(
    <div style={{
      display:"grid",
      gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",
      gap:"14px",
      marginBottom:"24px"
    }}>
      {EXPLORE_TILES.map(tile=>(
        <div
          key={tile}
          style={{
            background:"#fff",
            border:"1px solid var(--border)",
            borderRadius:"14px",
            padding:"18px",
            minHeight:"120px",
            position:"relative",
            overflow:"hidden",
            cursor:"pointer"
          }}
        >

          <div style={{
            position:"absolute",
            right:"-25px",
            top:"-25px",
            width:"90px",
            height:"90px",
            borderRadius:"50%",
            background:"rgba(200,75,47,0.05)"
          }}/>

          <div style={{
            fontFamily:"var(--serif)",
            fontSize:"1.5rem",
            lineHeight:"1.1"
          }}>
            {tile}
          </div>

          <div style={{
            position:"absolute",
            bottom:"16px",
            left:"18px",
            fontSize:"0.62rem",
            letterSpacing:"0.08em",
            textTransform:"uppercase",
            color:"var(--accent)",
            fontWeight:"700"
          }}>
            Explore
          </div>

        </div>
      ))}
    </div>
  )
}

function App(){

  const [tab,setTab] = useState("du");

  const TABS = [
    {id:"du",label:"DU"},
    {id:"college",label:"College"},
    {id:"explore",label:"Explore"}
  ];

  return(
    <div>

      <style>{CSS}</style>

      {/* NAVBAR */}

      <nav style={{
        height:"64px",
        display:"flex",
        alignItems:"center",
        padding:"0 30px",
        borderBottom:"1px solid var(--border)",
        background:"rgba(243,240,234,0.95)",
        backdropFilter:"blur(10px)",
        position:"sticky",
        top:0,
        zIndex:100
      }}>

        <a
          href="/"
          style={{
            textDecoration:"none",
            color:"var(--ink)",
            fontFamily:"var(--serif)",
            fontSize:"1.9rem",
            marginRight:"28px"
          }}
        >
          Un<em style={{
            color:"var(--accent)",
            fontStyle:"italic"
          }}>rest</em>
        </a>

        <div style={{
          display:"flex",
          gap:"4px",
          background:"rgba(0,0,0,0.05)",
          padding:"4px",
          borderRadius:"999px"
        }}>
          {TABS.map(t=>(
            <button
              key={t.id}
              onClick={()=>setTab(t.id)}
              style={{
                border:"none",
                borderRadius:"999px",
                padding:"8px 18px",
                background:tab===t.id ? "#fff" : "transparent",
                color:tab===t.id ? "var(--ink)" : "var(--ink3)",
                fontWeight:tab===t.id ? "700" : "500",
                cursor:"pointer"
              }}
            >
              {t.label}
            </button>
          ))}
        </div>

        <div style={{marginLeft:"auto"}}>
          <div style={{
            background:"#fff",
            border:"1px solid var(--border)",
            borderRadius:"8px",
            padding:"7px 12px",
            fontSize:"0.8rem"
          }}>
            Kirori Mal
          </div>
        </div>

      </nav>

      {/* MAIN */}

      <div style={{
        maxWidth:"1380px",
        margin:"0 auto",
        display:"grid",
        gridTemplateColumns:"260px minmax(720px,1fr) 260px",
        height:"calc(100vh - 64px)"
      }}>

        {/* LEFT SIDEBAR */}

        <aside style={{
          padding:"24px 20px",
          borderRight:"1px solid var(--border)",
          background:"rgba(255,255,255,0.28)",
          position:"sticky",
          top:"64px",
          height:"calc(100vh - 64px)",
          overflow:"hidden"
        }}>

          <div style={{
            fontSize:"0.6rem",
            textTransform:"uppercase",
            letterSpacing:"0.1em",
            color:"var(--ink4)",
            marginBottom:"12px",
            fontWeight:"700"
          }}>
            Your College
          </div>

          <div style={{
            background:"#fff",
            border:"1px solid var(--border)",
            borderRadius:"10px",
            padding:"14px",
            display:"flex",
            justifyContent:"space-between",
            alignItems:"center",
            marginBottom:"28px"
          }}>

            <div style={{
              display:"flex",
              alignItems:"center",
              gap:"10px"
            }}>
              <div style={{
                width:"8px",
                height:"8px",
                borderRadius:"50%",
                background:"var(--accent)"
              }}/>

              <span style={{
                fontSize:"0.88rem",
                fontWeight:"700"
              }}>
                Kirori Mal
              </span>
            </div>

            <span style={{
              fontSize:"0.72rem",
              color:"var(--ink3)"
            }}>
              347 members
            </span>

          </div>

          <div style={{
            fontSize:"0.6rem",
            textTransform:"uppercase",
            letterSpacing:"0.1em",
            color:"var(--ink4)",
            marginBottom:"14px",
            fontWeight:"700"
          }}>
            Activity
          </div>

          {[
            ["Posts today","84"],
            ["Active now","23"],
            ["DU-wide","1,247"],
            ["Your echoes","3"]
          ].map(item=>(
            <div style={{
              display:"flex",
              justifyContent:"space-between",
              padding:"10px 0",
              borderBottom:"1px solid rgba(0,0,0,0.05)"
            }}>
              <span style={{fontSize:"0.84rem"}}>
                {item[0]}
              </span>

              <span style={{
                fontSize:"0.84rem",
                fontWeight:"700"
              }}>
                {item[1]}
              </span>
            </div>
          ))}

          <div style={{
            marginTop:"28px",
            fontSize:"0.6rem",
            textTransform:"uppercase",
            letterSpacing:"0.1em",
            color:"var(--ink4)",
            marginBottom:"14px",
            fontWeight:"700"
          }}>
            Quick Links
          </div>

          {[
            "DU",
            "College",
            "Explore",
            "Following",
            "Saved"
          ].map(link=>(
            <div style={{
              padding:"9px 0",
              fontSize:"0.92rem",
              cursor:"pointer",
              color:link==="DU" ? "var(--accent)" : "var(--ink)"
            }}>
              {link}
            </div>
          ))}

        </aside>

        {/* FEED */}

        <main style={{
          padding:"28px",
          overflowY:"auto",
          height:"calc(100vh - 64px)"
        }}>

          <div style={{
            background:"#fff",
            border:"1px solid var(--border)",
            borderRadius:"14px",
            padding:"16px",
            marginBottom:"22px"
          }}>

            <div style={{
              display:"flex",
              gap:"14px",
              alignItems:"center"
            }}>

              <Avatar initials="MP"/>

              <input
                placeholder="What's happening at DU?"
                style={{
                  flex:1,
                  border:"1px solid rgba(0,0,0,0.08)",
                  borderRadius:"10px",
                  padding:"14px",
                  background:"#fafafa",
                  fontSize:"0.95rem",
                  outline:"none"
                }}
              />

            </div>

          </div>

          <Banner/>

          {tab==="explore"
            ? <ExploreTiles/>
            : POSTS.map(post=>(
                <PostCard key={post.id} post={post}/>
              ))
          }

        </main>

        {/* RIGHT SIDEBAR */}

        <aside style={{
          padding:"24px 20px",
          borderLeft:"1px solid var(--border)",
          background:"rgba(255,255,255,0.28)",
          position:"sticky",
          top:"64px",
          height:"calc(100vh - 64px)",
          overflow:"hidden"
        }}>

          <div style={{
            fontSize:"0.6rem",
            textTransform:"uppercase",
            letterSpacing:"0.1em",
            color:"var(--ink4)",
            marginBottom:"14px",
            fontWeight:"700"
          }}>
            Trending at DU
          </div>

          {[
            ["#NorthCampus","312 posts"],
            ["#PlacementSeason","247 posts"],
            ["#EconFest","189 posts"],
            ["#DULife","156 posts"],
            ["#CentralLibrary","98 posts"]
          ].map((tag,i)=>(
            <div style={{
              padding:"12px 0",
              borderBottom:"1px solid rgba(0,0,0,0.05)"
            }}>

              <div style={{
                fontSize:"0.68rem",
                color:"var(--ink4)",
                marginBottom:"4px"
              }}>
                {i+1}
              </div>

              <div style={{
                fontWeight:"700",
                fontSize:"0.96rem"
              }}>
                {tag[0]}
              </div>

              <div style={{
                fontSize:"0.75rem",
                color:"var(--ink3)",
                marginTop:"2px"
              }}>
                {tag[1]}
              </div>

            </div>
          ))}

          <div style={{
            marginTop:"28px",
            fontSize:"0.6rem",
            textTransform:"uppercase",
            letterSpacing:"0.1em",
            color:"var(--ink4)",
            marginBottom:"14px",
            fontWeight:"700"
          }}>
            Who to Follow
          </div>

          {[
            ["Rohan Mehta","Hindu College","RM"],
            ["Priya Sharma","Lady Shri Ram","PS"],
            ["Aditya Bose","SRCC","AB"],
            ["Nandini Roy","Miranda House","NR"]
          ].map(user=>(
            <div style={{
              display:"flex",
              alignItems:"center",
              justifyContent:"space-between",
              marginBottom:"16px"
            }}>

              <div style={{
                display:"flex",
                alignItems:"center",
                gap:"10px"
              }}>

                <Avatar initials={user[2]}/>

                <div>
                  <div style={{
                    fontSize:"0.84rem",
                    fontWeight:"700"
                  }}>
                    {user[0]}
                  </div>

                  <div style={{
                    fontSize:"0.68rem",
                    color:"var(--ink3)"
                  }}>
                    {user[1]}
                  </div>
                </div>

              </div>

              <button style={{
                border:"1px solid var(--border)",
                background:"#fff",
                borderRadius:"6px",
                padding:"6px 10px",
                fontSize:"0.7rem",
                cursor:"pointer"
              }}>
                Follow
              </button>

            </div>
          ))}

        </aside>

      </div>

    </div>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
